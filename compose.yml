name: kanban
services:
  postgres:
    image: postgres:18.1
    volumes:
      - kanban-postgres:/var/lib/postgresql
    ports:
      - 5432:5432
    env_file: ./backend/.env

  redis:
    image: redis:8.8-alpine
    volumes:
      - kanban-redis:/data
    ports:
      - 6379:6379

  seq:
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: 'Y'
    env_file: ./backend/.env
    volumes:
      - kanban-seq:/data
    ports:
      - 5341:80

volumes:
  kanban-postgres:
  kanban-redis:
  kanban-seq: