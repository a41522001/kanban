<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="470 80 390 844">
<defs>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#29324A" flood-opacity=".10"/></filter>
    <clipPath id="tablet"><rect x="940" y="80" width="768" height="1024" rx="20"/></clipPath><clipPath id="phone"><rect x="1750" y="80" width="390" height="844" rx="20"/></clipPath>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.label{font-size:19px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:28px;font-weight:750;letter-spacing:-.03em}.h1{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;letter-spacing:.05em;fill:#697287}.inverse{fill:#F7F8FA}.btn{font-size:14px;font-weight:700;fill:#FFF9F4}.card-title{font-size:14px;font-weight:650}
    </style>
    <g id="mark"><rect width="16" height="23" rx="4" fill="#DF6E51"/><rect x="22" y="7" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="mobile-card" filter="url(#s)"><rect width="262" height="126" rx="9" fill="#FFF"/><rect x="14" y="14" width="48" height="20" rx="10" fill="#FCE5DF"/><text x="38" y="28" text-anchor="middle" class="tiny" fill="#A9432E">API</text><text x="14" y="58" class="card-title">建立使用者註冊 API</text><text x="14" y="82" class="small">Auth · Backend</text></g>
  </defs>
<g id="mobile-signup">
    <rect x="470" y="80" width="390" height="844" rx="20" fill="#F7F8FA"/><g transform="translate(498 112)"><use href="#mark"/><text x="50" y="19" class="h2">Flowboard</text></g>
    <g transform="translate(494 170)"><rect width="42" height="4" rx="2" fill="#DF6E51"/><text y="48" class="display">建立你的工作區</text><text y="80" class="body" fill="#697287">從第一張卡片，開始建立節奏。</text><text y="132" class="body" font-weight="700">顯示名稱</text><rect y="148" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="176" class="body" fill="#8B95A8">例如：Jeffery</text><text y="230" class="body" font-weight="700">電子郵件</text><rect y="246" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="274" class="body" fill="#8B95A8">you@example.com</text><text y="328" class="body" font-weight="700">密碼</text><rect y="344" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="372" class="body" fill="#8B95A8">至少 8 個字元</text><rect y="402" width="80" height="4" rx="2" fill="#6EA99E"/><rect x="87" y="402" width="80" height="4" rx="2" fill="#6EA99E"/><rect x="174" y="402" width="80" height="4" rx="2" fill="#D9DEE7"/><rect x="261" y="402" width="80" height="4" rx="2" fill="#D9DEE7"/><text y="434" class="body" font-weight="700">確認密碼</text><rect y="450" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="478" class="body" fill="#8B95A8">再次輸入密碼</text><rect y="524" width="18" height="18" rx="4" fill="#29324A"/><path d="M4 533l4 4 7-8" stroke="#FFF" stroke-width="2" fill="none"/><text x="30" y="538" class="small">我同意服務條款與隱私權政策</text><rect y="572" width="342" height="50" rx="9" fill="#DF6E51"/><text x="171" y="603" text-anchor="middle" class="btn">建立工作區</text><text x="171" y="674" text-anchor="middle" class="body">已經有帳號？ <tspan fill="#C4573E" font-weight="700">返回登入</tspan></text></g>
  </g>
