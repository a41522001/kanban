<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="920" viewBox="0 0 1520 920">
  <defs>
    <filter id="lift-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#29324A" flood-opacity=".18"/></filter>
    <filter id="surface-shadow" x="-14%" y="-14%" width="128%" height="136%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#29324A" flood-opacity=".09"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec-label{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.state-title{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;letter-spacing:.04em;fill:#697287}.card-title{font-size:14px;font-weight:650}.chip{font-size:10px;font-weight:700}.inverse{fill:#F7F8FA}.lock-text{font-size:12px;font-weight:700;fill:#606A7F}
    </style>
    <g id="grip-icon" fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/></g>
    <g id="card-handle"><rect width="44" height="44" rx="10" fill="#FFFFFF" fill-opacity=".01"/><g transform="translate(16 13)" color="#8B95A8"><use href="#grip-icon"/></g></g>
    <g id="move-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h12M10 4l4 4-4 4"/></g>
  </defs>

  <!-- Drag states are component references, not additional pages. All spacing uses the 4px grid. -->
  <rect width="1520" height="920" fill="#E9ECF1"/>
  <text x="40" y="48" class="spec-label">BOARD / DRAG &amp; COLLABORATION STATES</text>

  <g id="default-state" transform="translate(40 80)">
    <rect width="344" height="300" rx="16" fill="#F7F8FA"/>
    <text x="20" y="32" class="state-title">01 / Default</text><text x="20" y="56" class="small">卡片內容可開啟，只有把手能拖曳。</text>
    <g transform="translate(20 88)" filter="url(#surface-shadow)">
      <rect width="304" height="136" rx="12" fill="#FFF"/><rect x="16" y="16" width="48" height="20" rx="10" fill="#FCE5DF"/><text x="40" y="30" text-anchor="middle" class="chip" fill="#A9432E">API</text>
      <g transform="translate(252 4)"><use href="#card-handle"/></g><text x="16" y="64" class="card-title">建立使用者註冊 API</text><text x="16" y="92" class="small">Auth · Backend</text>
    </g>
    <text x="20" y="260" class="tiny">HANDLE TARGET / 44 × 44</text>
  </g>

  <g id="dragging-state" transform="translate(400 80)">
    <rect width="344" height="300" rx="16" fill="#F7F8FA"/>
    <text x="20" y="32" class="state-title">02 / Dragging</text><text x="20" y="56" class="small">原位置保留 placeholder，卡片適度浮起。</text>
    <rect x="20" y="88" width="304" height="136" rx="12" fill="none" stroke="#AAB3C2" stroke-width="2" stroke-dasharray="8 8"/>
    <g transform="translate(32 76) rotate(-1 152 68)" filter="url(#lift-shadow)">
      <rect width="304" height="136" rx="12" fill="#FFF"/><rect x="16" y="16" width="64" height="20" rx="10" fill="#E3F1EC"/><text x="48" y="30" text-anchor="middle" class="chip" fill="#3E756B">Session</text>
      <g transform="translate(252 4)"><use href="#card-handle"/></g><text x="16" y="64" class="card-title">Session Cookie 驗證流程</text><text x="16" y="92" class="small">Redis · Auth</text>
    </g>
    <text x="20" y="268" class="tiny">LIFT / SHADOW + 1° MAX</text>
  </g>

  <g id="drop-target-state" transform="translate(760 80)">
    <rect width="344" height="300" rx="16" fill="#F7F8FA"/>
    <text x="20" y="32" class="state-title">03 / Valid drop target</text><text x="20" y="56" class="small">欄位與插入位置同時提供靜態提示。</text>
    <rect x="20" y="84" width="304" height="184" rx="12" fill="#F1F8F6" stroke="#6EA99E" stroke-width="2"/>
    <rect x="36" y="104" width="4" height="28" rx="2" fill="#A9D2C8"/><text x="52" y="124" class="card-title">正在進行</text>
    <rect x="36" y="152" width="272" height="4" rx="2" fill="#6EA99E"/>
    <text x="172" y="188" text-anchor="middle" class="small">放到這裡</text>
    <rect x="36" y="208" width="272" height="44" rx="10" fill="#FFF" opacity=".64"/>
  </g>

  <g id="locked-state" transform="translate(1120 80)">
    <rect width="360" height="300" rx="16" fill="#F7F8FA"/>
    <text x="20" y="32" class="state-title">04 / Soft locked</text><text x="20" y="56" class="small">只停用這張卡，不鎖整欄或整個 Board。</text>
    <g transform="translate(20 88)" filter="url(#surface-shadow)">
      <rect width="320" height="148" rx="12" fill="#FFF"/><g transform="translate(268 4)" opacity=".32"><use href="#card-handle"/></g>
      <text x="16" y="44" class="card-title">更新 session 文件</text><text x="16" y="68" class="small">2 則留言</text>
      <rect x="16" y="92" width="184" height="32" rx="16" fill="#EEF0F4"/><circle cx="32" cy="108" r="10" fill="#907ECE"/><text x="48" y="112" class="lock-text">Mia 正在移動此卡片</text>
    </g>
    <text x="20" y="268" class="tiny">TTL / 10 SECONDS</text>
  </g>

  <g id="mobile-long-press" transform="translate(40 412)">
    <rect width="704" height="452" rx="16" fill="#F7F8FA"/>
    <text x="24" y="36" class="state-title">05 / Mobile long press</text><text x="24" y="60" class="small">短按卡片開啟詳情；長按把手約 220ms 才開始拖曳。</text>
    <g transform="translate(24 92)">
      <rect width="304" height="304" rx="20" fill="#E9ECF1"/>
      <rect x="16" y="16" width="272" height="260" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
      <text x="36" y="52" class="card-title">準備開始</text>
      <g transform="translate(28 72)" filter="url(#surface-shadow)">
        <rect width="248" height="136" rx="12" fill="#FFF"/><rect x="16" y="16" width="48" height="20" rx="10" fill="#FCE5DF"/><g transform="translate(196 4)"><use href="#card-handle"/></g>
        <text x="16" y="64" class="card-title">建立使用者註冊 API</text><text x="16" y="92" class="small">Auth · Backend</text>
      </g>
    </g>
    <g transform="translate(368 108)">
      <circle cx="28" cy="28" r="28" fill="#29324A"/><text x="28" y="34" text-anchor="middle" class="body inverse" font-weight="700">1</text><text x="76" y="24" class="body" font-weight="700">手指按住 Drag handle</text><text x="76" y="48" class="small">卡片內容仍保留短按開啟。</text>
      <line x1="28" y1="68" x2="28" y2="116" stroke="#CDD3DE" stroke-width="2"/>
      <circle cx="28" cy="144" r="28" fill="#29324A"/><text x="28" y="150" text-anchor="middle" class="body inverse" font-weight="700">2</text><text x="76" y="140" class="body" font-weight="700">220ms 後進入拖曳</text><text x="76" y="164" class="small">可使用輕微震動或浮起回饋。</text>
      <line x1="28" y1="184" x2="28" y2="232" stroke="#CDD3DE" stroke-width="2"/>
      <circle cx="28" cy="260" r="28" fill="#29324A"/><text x="28" y="266" text-anchor="middle" class="body inverse" font-weight="700">3</text><text x="76" y="256" class="body" font-weight="700">拖到目標後放開</text><text x="76" y="280" class="small">等待 Server ACK 或權威事件。</text>
    </g>
  </g>

  <g id="alternative-move" transform="translate(760 412)">
    <rect width="720" height="452" rx="16" fill="#F7F8FA"/>
    <text x="24" y="36" class="state-title">06 / Single-pointer alternative</text><text x="24" y="60" class="small">拖曳不是唯一操作；卡片詳情保留「移動至…」。</text>
    <g transform="translate(24 92)">
      <rect width="672" height="304" rx="16" fill="#FFF" stroke="#D7DCE5"/>
      <text x="24" y="40" class="tiny">卡片操作</text>
      <text x="24" y="80" class="state-title">Session Cookie 驗證流程</text><text x="24" y="108" class="small">目前位於「正在進行」</text>
      <line x1="24" y1="136" x2="648" y2="136" stroke="#D9DEE7"/>
      <g transform="translate(360 24)">
        <rect width="288" height="52" rx="10" fill="#29324A"/><g transform="translate(20 18)" color="#F7F8FA"><use href="#move-icon"/></g><text x="152" y="32" text-anchor="middle" class="body inverse" font-weight="700">移動至…</text>
        <rect y="68" width="288" height="48" rx="10" fill="#F7F8FA" stroke="#D7DCE5"/><text x="20" y="98" class="body">準備開始</text>
        <rect y="128" width="288" height="48" rx="10" fill="#E3F1EC" stroke="#6EA99E"/><text x="20" y="158" class="body" font-weight="700">正在進行</text>
        <rect y="188" width="288" height="48" rx="10" fill="#F7F8FA" stroke="#D7DCE5"/><text x="20" y="218" class="body">等待檢視</text>
      </g>
      <text x="24" y="184" class="body" font-weight="700">鍵盤與螢幕閱讀器</text><text x="24" y="212" class="small">選擇目標欄位後，由同一個 card:move 流程處理。</text>
      <text x="24" y="256" class="tiny">WCAG 2.2 / DRAGGING MOVEMENTS</text>
    </g>
  </g>
</svg>
