<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <filter id="dropdown-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#29324A" flood-opacity=".2"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.title{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.03em}.inverse{fill:#F7F8FA}.medium{font-weight:700}
    </style>
    <g id="mark"><rect width="16" height="24" rx="4" fill="#DF6E51"/><rect x="22" y="8" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="bell" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3.2 3.2L13 4.5"/></g>
    <g id="x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></g>
  </defs>

  <rect width="390" height="844" rx="20" fill="#E9ECF1"/>
  <path d="M0 20Q0 0 20 0h350q20 0 20 20v36H0z" fill="#29324A"/>
  <g transform="translate(20 16)"><use href="#mark" transform="scale(.84)"/><text x="48" y="18" class="h2 inverse">Flowboard</text>
    <rect x="270" y="-8" width="40" height="40" rx="9" fill="#F7F8FA"/><g transform="translate(280 2)" color="#29324A"><use href="#bell"/></g>
    <circle cx="306" cy="-10" r="9" fill="#DF6E51"/><text x="306" y="-6" text-anchor="middle" class="label inverse">1</text>
    <circle cx="346" cy="12" r="16" fill="#A9D2C8"/><text x="346" y="17" text-anchor="middle" class="body medium">J</text>
  </g>
  <g transform="translate(24 84)">
    <text class="tiny">目前工作區</text><rect y="20" width="342" height="56" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
    <rect x="12" y="32" width="32" height="32" rx="8" fill="#DF6E51"/><text x="28" y="53" text-anchor="middle" class="body inverse medium">J</text>
    <text x="56" y="44" class="body medium">Jeffery 的工作區</text><text x="56" y="62" class="tiny">3 個專案 · 5 位成員</text>
  </g>

  <g id="workspace-invitation-response-mobile" transform="translate(16 68)" filter="url(#dropdown-shadow)">
    <rect width="358" height="540" rx="18" fill="#FFFFFF" stroke="#D7DCE5"/>
    <text x="16" y="37" class="title">通知</text>
    <rect x="264" y="16" width="78" height="28" rx="14" fill="#FCE5DF"/><text x="303" y="34" text-anchor="middle" class="label" fill="#9F3F2C">1 則未讀</text>
    <line x1="16" y1="60" x2="342" y2="60" stroke="#D7DCE5"/>

    <g transform="translate(16 72)">
      <rect width="326" height="282" rx="12" fill="#FFF9F7" stroke="#DF6E51"/>
      <rect width="4" height="282" rx="2" fill="#DF6E51"/>
      <circle cx="34" cy="34" r="20" fill="#DF6E51"/><text x="34" y="39" text-anchor="middle" class="body inverse medium">M</text>
      <text x="66" y="24" class="label" fill="#9F3F2C">工作區邀請</text><circle cx="310" cy="12" r="4" fill="#DF6E51"/>
      <rect x="66" y="38" width="86" height="24" rx="12" fill="#FCE5DF"/><text x="109" y="54" text-anchor="middle" class="tiny" fill="#9F3F2C">等待你的回覆</text>
      <text x="66" y="88" class="body medium">Mia 邀請你加入</text><text x="66" y="113" class="h2">「產品開發中心」</text>
      <text x="66" y="141" class="small">加入後，你可以查看工作區內的專案，</text><text x="66" y="161" class="small">並以成員身分參與協作。</text>
      <text x="66" y="186" class="tiny">5 分鐘前 · 邀請將於 7 天後到期</text>
      <line x1="16" y1="202" x2="310" y2="202" stroke="#E8D6D1"/>
      <rect x="16" y="218" width="142" height="48" rx="9" fill="#DF6E51"/>
      <g transform="translate(31 234)" color="#F7F8FA"><use href="#check"/></g><text x="91" y="248" text-anchor="middle" class="body inverse medium">接受邀請</text>
      <rect x="168" y="218" width="142" height="48" rx="9" fill="#FFFFFF" stroke="#CDD3DE"/>
      <g transform="translate(187 234)" color="#697287"><use href="#x"/></g><text x="243" y="248" text-anchor="middle" class="body medium">婉拒</text>
    </g>

    <g transform="translate(16 366)">
      <rect width="326" height="112" rx="12" fill="#FFFFFF" stroke="#D7DCE5"/>
      <circle cx="34" cy="34" r="20" fill="#A9D2C8"/><text x="34" y="39" text-anchor="middle" class="body medium">F</text>
      <text x="66" y="24" class="label" fill="#697287">工作區動態</text>
      <text x="66" y="52" class="body medium">Flowboard 即時協作</text><text x="66" y="74" class="body medium">有 2 項更新</text><text x="66" y="100" class="tiny">昨天</text>
    </g>
    <text x="16" y="516" class="tiny">目前顯示最近通知</text>
  </g>
</svg>
