<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <filter id="dialog-shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#182033" flood-opacity=".28"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.title{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.03em}.inverse{fill:#F7F8FA}.medium{font-weight:700}
    </style>
    <g id="mark"><rect width="16" height="24" rx="4" fill="#DF6E51"/><rect x="22" y="8" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="bell" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3.2 3.2L13 4.5"/></g>
    <g id="x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></g>
  </defs>

  <rect width="390" height="844" rx="20" fill="#E9ECF1"/>
  <path d="M0 20Q0 0 20 0h350q20 0 20 20v36H0z" fill="#29324A"/>
  <g transform="translate(20 16)"><use href="#mark" transform="scale(.84)"/><text x="48" y="18" class="h2 inverse">Flowboard</text><circle cx="346" cy="12" r="16" fill="#A9D2C8"/><text x="346" y="17" text-anchor="middle" class="body medium">J</text></g>
  <g transform="translate(24 84)">
    <text class="tiny">目前工作區</text><rect y="20" width="342" height="56" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
    <rect x="12" y="32" width="32" height="32" rx="8" fill="#DF6E51"/><text x="28" y="53" text-anchor="middle" class="body inverse medium">J</text>
    <text x="56" y="44" class="body medium">Jeffery 的工作區</text><text x="56" y="62" class="tiny">3 個專案 · 5 位成員</text>
  </g>

  <rect width="390" height="844" rx="20" fill="#182033" opacity=".5"/>

  <g id="workspace-invitation-detail-dialog-mobile" transform="translate(16 132)" filter="url(#dialog-shadow)">
    <rect width="358" height="570" rx="18" fill="#FFFFFF"/>
    <rect width="358" height="6" rx="3" fill="#DF6E51"/>
    <circle cx="40" cy="48" r="22" fill="#FCE5DF"/><g transform="translate(30 38) scale(.84)" color="#9F3F2C"><use href="#bell"/></g>
    <text x="76" y="43" class="title">工作區邀請</text><text x="76" y="64" class="tiny">查看內容後再決定是否加入</text>
    <rect x="306" y="24" width="36" height="36" rx="9" fill="#F7F8FA"/><g transform="translate(316 34)" color="#697287"><use href="#x"/></g>
    <line x1="16" y1="92" x2="342" y2="92" stroke="#D7DCE5"/>

    <g transform="translate(16 112)">
      <rect width="326" height="142" rx="14" fill="#FFF9F7" stroke="#E8B8AB"/>
      <circle cx="42" cy="42" r="24" fill="#DF6E51"/><text x="42" y="48" text-anchor="middle" class="h2 inverse">M</text>
      <text x="78" y="31" class="small">Mia 邀請你加入</text><text x="78" y="58" class="h2">產品開發中心</text>
      <text x="18" y="96" class="small">加入後可查看工作區內的專案，</text><text x="18" y="118" class="small">並以成員身分參與協作。</text>
    </g>

    <g transform="translate(16 278)">
      <text class="label" fill="#697287">邀請詳情</text>
      <text y="32" class="small">角色</text><text x="326" y="32" text-anchor="end" class="body medium">成員</text>
      <line y1="50" x2="326" y2="50" stroke="#E9ECF1"/>
      <text y="80" class="small">有效期限</text><text x="326" y="80" text-anchor="end" class="body medium">7 天後到期</text>
    </g>

    <line x1="16" y1="390" x2="342" y2="390" stroke="#D7DCE5"/>
    <rect x="16" y="410" width="326" height="48" rx="10" fill="#DF6E51"/>
    <g transform="translate(115 426)" color="#F7F8FA"><use href="#check"/></g><text x="187" y="440" text-anchor="middle" class="body inverse medium">接受邀請</text>
    <rect x="16" y="470" width="326" height="48" rx="10" fill="#FFFFFF" stroke="#CDD3DE"/>
    <g transform="translate(129 486)" color="#697287"><use href="#x"/></g><text x="187" y="500" text-anchor="middle" class="body medium">婉拒</text>
    <text x="16" y="546" class="tiny">Dialog 保留 16px viewport gutter，動作高度 48px</text>
  </g>
</svg>
