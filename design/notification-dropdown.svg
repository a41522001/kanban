<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="dropdown-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#29324A" flood-opacity=".18"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:32px;font-weight:750}.title{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.03em}.inverse{fill:#F7F8FA}.muted{fill:#BFC7D7}.medium{font-weight:700}
    </style>
    <g id="logo"><rect width="18" height="24" rx="4" fill="#DF6E51"/><rect x="24" y="8" width="18" height="16" rx="4" fill="#A9D2C8"/><text x="56" y="20" class="h2 inverse">Flowboard</text></g>
    <g id="plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></g>
    <g id="bell" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></g>
    <g id="check-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 8 4 4L14 4M10 12l2 2 6-7"/></g>
    <g id="chevron" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></g>
  </defs>

  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="48" class="spec">NOTIFICATION / INBOX / DESKTOP / 1440 × 900</text>
  <g id="notification-inbox-desktop">
    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#E9ECF1"/>
    <path d="M40 100q0-20 20-20h1400q20 0 20 20v44H40z" fill="#29324A"/>
    <g transform="translate(72 100)">
      <use href="#logo"/><text x="180" y="20" class="body inverse medium">工作區</text><text x="256" y="20" class="body muted">最近</text>
      <rect x="1188" y="-8" width="40" height="40" rx="9" fill="#DF6E51"/><g transform="translate(1200 4)" color="#F7F8FA"><use href="#plus"/></g>
      <rect x="1240" y="-8" width="40" height="40" rx="9" fill="#F7F8FA"/><g transform="translate(1250 2)" color="#29324A"><use href="#bell"/></g>
      <circle cx="1276" cy="-10" r="9" fill="#DF6E51"/><text x="1276" y="-6" text-anchor="middle" class="label inverse">2</text>
      <circle cx="1328" cy="12" r="16" fill="#A9D2C8"/><text x="1328" y="17" text-anchor="middle" class="body medium">J</text>
    </g>

    <g transform="translate(72 176)">
      <text class="small">工作區</text><text y="44" class="display">Jeffery 的工作區</text><text y="76" class="body" fill="#697287">集中查看所有專案，選一個進入主要看板。</text>
      <text y="136" class="title">最近開啟</text>
      <rect y="156" width="552" height="132" rx="12" fill="#F7F8FA"/><rect y="156" width="4" height="132" rx="2" fill="#DF6E51"/>
      <text x="24" y="192" class="h2">Flowboard 即時協作</text><text x="24" y="220" class="small">主要看板 · WebSocket 練習</text>
      <rect x="568" y="156" width="552" height="132" rx="12" fill="#F7F8FA"/><rect x="568" y="156" width="4" height="132" rx="2" fill="#A9D2C8"/>
      <text x="592" y="192" class="h2">發佈自動化</text><text x="592" y="220" class="small">主要看板 · CI/CD 與部署檢查</text>
    </g>

    <g id="notification-dropdown" transform="translate(1048 148)" filter="url(#dropdown-shadow)">
      <rect width="400" height="488" rx="18" fill="#FFFFFF" stroke="#D7DCE5"/>
      <text x="16" y="39" class="title">通知</text>
      <rect x="72" y="18" width="74" height="24" rx="12" fill="#FCE5DF"/><text x="109" y="34" text-anchor="middle" class="label" fill="#9F3F2C">2 則未讀</text>
      <rect x="246" y="12" width="138" height="40" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/>
      <g transform="translate(260 22)" color="#697287"><use href="#check-check"/></g><text x="332" y="37" text-anchor="middle" class="small medium">全部設為已讀</text>
      <line x1="16" y1="64" x2="384" y2="64" stroke="#D7DCE5"/>

      <g id="workspace-invitation-unread" transform="translate(16 76)">
        <rect width="368" height="126" rx="12" fill="#FFF9F7" stroke="#DF6E51"/><rect width="4" height="126" rx="2" fill="#DF6E51"/>
        <circle cx="36" cy="36" r="20" fill="#DF6E51"/><text x="36" y="41" text-anchor="middle" class="body inverse medium">M</text>
        <text x="68" y="26" class="label" fill="#9F3F2C">工作區邀請</text>
        <text x="68" y="54" class="body medium">Mia 邀請你加入「產品開發中心」</text>
        <text x="68" y="79" class="small">點擊查看邀請內容與回覆選項</text><text x="68" y="104" class="tiny">5 分鐘前</text>
        <circle cx="294" cy="24" r="4" fill="#DF6E51"/>
        <rect x="306" y="10" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#E8B8AB"/>
        <g transform="translate(316 20)" color="#9F3F2C"><use href="#check-check"/></g>
        <g transform="translate(326 92)" color="#697287"><use href="#chevron"/></g>
      </g>

      <g id="workspace-activity-read" transform="translate(16 214)">
        <rect width="368" height="108" rx="12" fill="#FFFFFF" stroke="#D7DCE5"/>
        <circle cx="36" cy="36" r="20" fill="#A9D2C8"/><text x="36" y="41" text-anchor="middle" class="body medium">F</text>
        <text x="68" y="26" class="label" fill="#697287">工作區動態</text>
        <text x="68" y="54" class="body medium">Flowboard 即時協作有 2 項更新</text>
        <text x="68" y="82" class="tiny">昨天 · 已讀</text>
        <g transform="translate(326 47)" color="#8B95A8"><use href="#chevron"/></g>
      </g>

      <g id="card-mention-unread" transform="translate(16 334)">
        <rect width="368" height="92" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
        <circle cx="36" cy="36" r="18" fill="#DF6E51"/><text x="36" y="41" text-anchor="middle" class="tiny inverse medium">A</text>
        <text x="66" y="31" class="small medium">卡片「API 錯誤處理」提及了你</text><text x="66" y="55" class="tiny">2 天前</text>
        <circle cx="294" cy="24" r="4" fill="#DF6E51"/>
        <rect x="306" y="8" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#D7DCE5"/><g transform="translate(316 18)" color="#697287"><use href="#check-check"/></g>
        <g transform="translate(326 64)" color="#697287"><use href="#chevron"/></g>
      </g>

      <text x="16" y="462" class="tiny">選取通知查看對應內容；已讀操作不會執行資源動作</text>
    </g>
  </g>
</svg>
