<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs><filter id="shadow" x="-16%" y="-16%" width="132%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#29324A" flood-opacity=".10"/></filter><style>text{font-family:'Noto Sans TC',Arial,sans-serif;fill:#29324A}.spec{font-size:12px;font-weight:700;fill:#697287;letter-spacing:.8px}.tiny{font-size:12px;fill:#697287}.small{font-size:14px;fill:#697287}.body{font-size:16px}.label{font-size:14px;font-weight:700}.h2{font-size:20px;font-weight:700}.inverse{fill:#F7F8FA}</style></defs>
  <rect width="1520" height="1000" fill="#E9ECF1"/><text x="40" y="48" class="spec">BOARD / SYSTEM STATES / DESKTOP</text>
  <g id="empty-column" transform="translate(40 80)"><rect width="344" height="300" rx="16" fill="#F7F8FA"/><text x="24" y="36" class="h2">01 / Empty column</text><rect x="24" y="64" width="296" height="212" rx="12" fill="#FFF" stroke="#D7DCE5" stroke-dasharray="8 8"/><circle cx="172" cy="144" r="24" fill="#FCE5DF"/><text x="172" y="152" text-anchor="middle" class="h2" style="fill:#9F3F2C">+</text><text x="172" y="198" text-anchor="middle" class="label">這個欄位還沒有卡片</text><text x="172" y="222" text-anchor="middle" class="tiny">新增卡片開始整理下一步。</text></g>
  <g id="loading" transform="translate(404 80)"><rect width="344" height="300" rx="16" fill="#F7F8FA"/><text x="24" y="36" class="h2">02 / Loading</text><rect x="24" y="64" width="296" height="212" rx="12" fill="#FFF"/><circle cx="172" cy="144" r="22" fill="none" stroke="#CDD3DE" stroke-width="4"/><path d="M172 122a22 22 0 0 1 21 17" fill="none" stroke="#DF6E51" stroke-width="4" stroke-linecap="round"/><text x="172" y="196" text-anchor="middle" class="label">正在同步看板…</text><text x="172" y="220" text-anchor="middle" class="tiny">請保留目前頁面。</text></g>
  <g id="load-error" transform="translate(768 80)"><rect width="344" height="300" rx="16" fill="#F7F8FA"/><text x="24" y="36" class="h2">03 / Load error</text><rect x="24" y="64" width="296" height="212" rx="12" fill="#FFF" stroke="#D7DCE5"/><circle cx="172" cy="144" r="22" fill="#FCE5DF"/><text x="172" y="152" text-anchor="middle" class="h2" style="fill:#9F3F2C">!</text><text x="172" y="196" text-anchor="middle" class="label">無法載入看板</text><text x="172" y="220" text-anchor="middle" class="tiny">重新整理後再試一次。</text><rect x="128" y="236" width="88" height="28" rx="8" fill="#29324A"/><text x="172" y="255" text-anchor="middle" class="tiny inverse">重新整理</text></g>
  <g id="server-rejected-move" transform="translate(1132 80)"><rect width="344" height="300" rx="16" fill="#F7F8FA"/><text x="24" y="36" class="h2">04 / Move rejected</text><rect x="24" y="64" width="296" height="212" rx="12" fill="#FFF" stroke="#D7DCE5"/><rect x="44" y="92" width="256" height="72" rx="10" fill="#FCE5DF"/><text x="60" y="120" class="label" style="fill:#9F3F2C">移動未完成</text><text x="60" y="146" class="tiny">伺服器已回復為最新欄位位置。</text><text x="44" y="204" class="label">更新 session 文件</text><text x="44" y="230" class="tiny">顯示最新版本，避免覆蓋他人操作。</text></g>
  <g id="delete-confirmation" transform="translate(40 428)"><rect width="1436" height="532" rx="20" fill="#29324A" opacity=".22"/><g filter="url(#shadow)"><rect x="468" y="116" width="500" height="300" rx="16" fill="#FFF"/><text x="500" y="164" class="h2">刪除這張卡片？</text><text x="500" y="202" class="body">「建立使用者註冊 API」及活動紀錄將被永久刪除。</text><text x="500" y="230" class="small">此動作無法復原。</text><line x1="468" y1="276" x2="968" y2="276" stroke="#D7DCE5"/><rect x="676" y="304" width="112" height="48" rx="10" fill="#FFF" stroke="#CDD3DE"/><text x="732" y="334" text-anchor="middle" class="label">取消</text><rect x="800" y="304" width="136" height="48" rx="10" fill="#DF6E51"/><text x="868" y="334" text-anchor="middle" class="label inverse">刪除卡片</text></g><text x="24" y="28" class="spec">05 / DELETE CONFIRMATION / MODAL</text></g>
</svg>
