<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <filter id="surface-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#111827" flood-opacity=".22"/></filter>
    <style>text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.title{font-size:22px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;letter-spacing:.04em;fill:#697287}.inverse{fill:#F7F8FA}.button{font-size:14px;font-weight:700}.medium{font-weight:700}.disabled{fill:#9AA3B4}</style>
    <g id="mark"><rect width="16" height="24" rx="4" fill="#DF6E51"/><rect x="22" y="8" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="close" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l12 12M15 3 3 15"/></g>
    <g id="search" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3 3 7-7"/></g>
  </defs>

  <rect width="390" height="844" rx="20" fill="#E9ECF1"/>
  <path d="M0 20Q0 0 20 0h350q20 0 20 20v36H0z" fill="#29324A"/>
  <g transform="translate(20 16)"><use href="#mark" transform="scale(.84)"/><text x="48" y="18" class="h2 inverse">Flowboard</text><circle cx="350" cy="12" r="16" fill="#A9D2C8"/><text x="350" y="17" text-anchor="middle" class="body medium">J</text></g>
  <g transform="translate(24 80)"><text class="tiny">目前工作區</text><rect y="20" width="342" height="56" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/><text x="16" y="54" class="body medium">無限有限公司</text><text y="116" class="title">專案中心</text><rect y="142" width="342" height="300" rx="14" fill="#FFFFFF" stroke="#DF6E51" stroke-width="2"/><text x="20" y="184" class="h2">Flowboard 即時協作</text><text x="20" y="212" class="small">4 位專案成員</text><rect x="20" y="370" width="145" height="48" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/><text x="92.5" y="400" text-anchor="middle" class="button">管理成員</text><rect x="177" y="370" width="145" height="48" rx="9" fill="#DF6E51"/><text x="249.5" y="400" text-anchor="middle" class="button inverse">進入看板</text></g>
  <rect width="390" height="844" rx="20" fill="#172033" opacity=".62"/>

  <g id="dialog" transform="translate(16 34)" filter="url(#surface-shadow)">
    <rect width="358" height="776" rx="18" fill="#FFFFFF"/>
    <text x="24" y="44" class="title">新增專案成員</text><rect x="294" y="18" width="40" height="40" rx="9" fill="#F7F8FA"/><g transform="translate(305 29)" color="#697287"><use href="#close"/></g>
    <text x="24" y="76" class="small">從目前工作區選擇一位成員。</text>

    <g transform="translate(24 96)"><rect width="310" height="58" rx="11" fill="#F7F8FA" stroke="#D7DCE5"/><rect x="10" y="9" width="40" height="40" rx="10" fill="#DF6E51"/><text x="30" y="35" text-anchor="middle" class="body inverse medium">F</text><text x="62" y="25" class="body medium">Flowboard 即時協作</text><text x="62" y="43" class="tiny">無限有限公司 · 4 位成員</text></g>

    <text x="24" y="186" class="body medium">選擇工作區成員 *</text>
    <g transform="translate(24 198)" color="#697287"><rect width="310" height="48" rx="9" fill="#FFFFFF" stroke="#D7DCE5"/><g transform="translate(16 16)"><use href="#search"/></g><text x="48" y="30" class="body" fill="#8B95A8">搜尋姓名</text></g>
    <text x="24" y="270" class="tiny">已加入專案的成員不可再次選取</text>

    <g transform="translate(24 282)"><rect width="310" height="50" rx="10" fill="#F7F8FA"/><circle cx="26" cy="25" r="17" fill="#A9D2C8"/><text x="26" y="30" text-anchor="middle" class="body medium">J</text><text x="56" y="22" class="body medium disabled">Jeffery</text><text x="56" y="39" class="tiny">工作區擁有者</text><rect x="238" y="11" width="60" height="28" rx="14" fill="#E9ECF1"/><text x="268" y="30" text-anchor="middle" class="small">已加入</text></g>
    <g transform="translate(24 340)"><rect width="310" height="50" rx="10" fill="#FFF9F4" stroke="#DF6E51" stroke-width="2"/><circle cx="26" cy="25" r="17" fill="#907ECE"/><text x="26" y="30" text-anchor="middle" class="body inverse medium">M</text><text x="56" y="30" class="body medium">Mina</text><circle cx="282" cy="25" r="10" fill="#DF6E51"/><g transform="translate(275 18)" color="#FFFFFF"><use href="#check"/></g></g>
    <g transform="translate(24 398)"><rect width="310" height="50" rx="10" fill="#FFFFFF" stroke="#D7DCE5"/><circle cx="26" cy="25" r="17" fill="#E6B960"/><text x="26" y="30" text-anchor="middle" class="body medium">A</text><text x="56" y="30" class="body medium">Alex</text><circle cx="282" cy="25" r="10" fill="#FFFFFF" stroke="#B7BFCE" stroke-width="2"/></g>
    <g transform="translate(24 456)"><rect width="310" height="50" rx="10" fill="#F7F8FA"/><circle cx="26" cy="25" r="17" fill="#DF6E51"/><text x="26" y="30" text-anchor="middle" class="body inverse medium">L</text><text x="56" y="22" class="body medium disabled">Lena</text><text x="56" y="39" class="tiny">目前為 EDITOR</text><rect x="238" y="11" width="60" height="28" rx="14" fill="#E9ECF1"/><text x="268" y="30" text-anchor="middle" class="small">已加入</text></g>
    <text x="179" y="526" text-anchor="middle" class="small">顯示 4 / 5 位工作區成員</text>

    <text x="24" y="562" class="body medium">專案角色 *</text>
    <g transform="translate(24 574)"><rect width="149" height="58" rx="10" fill="#FFF9F4" stroke="#DF6E51" stroke-width="2"/><circle cx="18" cy="19" r="7" fill="#DF6E51"/><text x="34" y="23" class="body medium">EDITOR</text><text x="14" y="45" class="tiny">可編輯專案內容</text><rect x="161" width="149" height="58" rx="10" fill="#FFFFFF" stroke="#D7DCE5"/><circle cx="179" cy="19" r="7" fill="#FFFFFF" stroke="#B7BFCE" stroke-width="2"/><text x="195" y="23" class="body medium">VIEWER</text><text x="175" y="45" class="tiny">僅能查看專案</text></g>

    <line x1="24" y1="662" x2="334" y2="662" stroke="#D7DCE5"/>
    <rect x="24" y="682" width="149" height="48" rx="9" fill="#FFFFFF" stroke="#D7DCE5"/><text x="98.5" y="712" text-anchor="middle" class="button">取消</text>
    <rect x="185" y="682" width="149" height="48" rx="9" fill="#DF6E51"/><text x="259.5" y="712" text-anchor="middle" class="button inverse">新增 Mina</text>
    <text x="179" y="756" text-anchor="middle" class="tiny">一次新增一位，完成後更新專案成員列表</text>
  </g>
</svg>
