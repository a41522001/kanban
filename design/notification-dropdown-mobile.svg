<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <filter id="dropdown-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#29324A" flood-opacity=".2"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.title{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.03em}.inverse{fill:#F7F8FA}.medium{font-weight:700}
    </style>
    <g id="mark"><rect width="16" height="24" rx="4" fill="#DF6E51"/><rect x="22" y="8" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="bell" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></g>
    <g id="check-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 8 4 4L14 4M10 12l2 2 6-7"/></g>
    <g id="chevron" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></g>
  </defs>

  <rect width="390" height="844" rx="20" fill="#E9ECF1"/>
  <path d="M0 20Q0 0 20 0h350q20 0 20 20v36H0z" fill="#29324A"/>
  <g transform="translate(20 16)"><use href="#mark" transform="scale(.84)"/><text x="48" y="18" class="h2 inverse">Flowboard</text>
    <rect x="270" y="-8" width="40" height="40" rx="9" fill="#F7F8FA"/><g transform="translate(280 2)" color="#29324A"><use href="#bell"/></g>
    <circle cx="306" cy="-10" r="9" fill="#DF6E51"/><text x="306" y="-6" text-anchor="middle" class="label inverse">2</text>
    <circle cx="346" cy="12" r="16" fill="#A9D2C8"/><text x="346" y="17" text-anchor="middle" class="body medium">J</text>
  </g>

  <g id="notification-inbox-mobile" transform="translate(16 68)" filter="url(#dropdown-shadow)">
    <rect width="358" height="532" rx="18" fill="#FFFFFF" stroke="#D7DCE5"/>
    <text x="16" y="39" class="title">通知</text>
    <rect x="70" y="18" width="72" height="24" rx="12" fill="#FCE5DF"/><text x="106" y="34" text-anchor="middle" class="label" fill="#9F3F2C">2 則未讀</text>
    <rect x="210" y="10" width="132" height="44" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/>
    <g transform="translate(222 22)" color="#697287"><use href="#check-check"/></g><text x="291" y="38" text-anchor="middle" class="small medium">全部設為已讀</text>
    <line x1="16" y1="66" x2="342" y2="66" stroke="#D7DCE5"/>

    <g transform="translate(16 78)">
      <rect width="326" height="138" rx="12" fill="#FFF9F7" stroke="#DF6E51"/><rect width="4" height="138" rx="2" fill="#DF6E51"/>
      <circle cx="36" cy="36" r="20" fill="#DF6E51"/><text x="36" y="41" text-anchor="middle" class="body inverse medium">M</text>
      <text x="68" y="27" class="label" fill="#9F3F2C">工作區邀請</text>
      <text x="68" y="56" class="body medium">Mia 邀請你加入</text><text x="68" y="78" class="body medium">「產品開發中心」</text>
      <text x="68" y="103" class="tiny">5 分鐘前 · 點擊查看</text>
      <circle cx="250" cy="24" r="4" fill="#DF6E51"/>
      <rect x="266" y="10" width="44" height="44" rx="9" fill="#FFFFFF" stroke="#E8B8AB"/><g transform="translate(278 22)" color="#9F3F2C"><use href="#check-check"/></g>
      <g transform="translate(282 108)" color="#697287"><use href="#chevron"/></g>
    </g>

    <g transform="translate(16 228)">
      <rect width="326" height="112" rx="12" fill="#FFFFFF" stroke="#D7DCE5"/>
      <circle cx="36" cy="36" r="20" fill="#A9D2C8"/><text x="36" y="41" text-anchor="middle" class="body medium">F</text>
      <text x="68" y="27" class="label" fill="#697287">工作區動態</text>
      <text x="68" y="56" class="body medium">Flowboard 即時協作</text><text x="68" y="78" class="body medium">有 2 項更新</text>
      <text x="68" y="99" class="tiny">昨天 · 已讀</text><g transform="translate(282 48)" color="#8B95A8"><use href="#chevron"/></g>
    </g>

    <g transform="translate(16 352)">
      <rect width="326" height="102" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
      <circle cx="36" cy="36" r="18" fill="#DF6E51"/><text x="36" y="41" text-anchor="middle" class="tiny inverse medium">A</text>
      <text x="66" y="32" class="small medium">卡片「API 錯誤處理」提及了你</text><text x="66" y="56" class="tiny">2 天前</text>
      <circle cx="250" cy="24" r="4" fill="#DF6E51"/>
      <rect x="266" y="10" width="44" height="44" rx="9" fill="#FFFFFF" stroke="#D7DCE5"/><g transform="translate(278 22)" color="#697287"><use href="#check-check"/></g>
      <g transform="translate(282 72)" color="#697287"><use href="#chevron"/></g>
    </g>

    <text x="16" y="494" class="tiny">內容區與已讀按鈕是兩個獨立的 44px 操作目標</text>
  </g>
</svg>
