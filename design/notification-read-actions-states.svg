<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#29324A" flood-opacity=".12"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.title{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.03em}.inverse{fill:#F7F8FA}.medium{font-weight:700}
    </style>
    <g id="check-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 8 4 4L14 4M10 12l2 2 6-7"/></g>
    <g id="error" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M10 6v5M10 14h.01"/></g>
    <g id="spinner" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 10a8 8 0 1 1-5.6-7.64"/></g>
    <g id="notification-copy">
      <circle cx="32" cy="34" r="18" fill="#DF6E51"/><text x="32" y="39" text-anchor="middle" class="body inverse medium">J</text>
      <text x="60" y="25" class="label" fill="#9F3F2C">工作區邀請</text>
      <text x="60" y="54" class="small medium">Jeffery 邀請你加入</text><text x="60" y="75" class="small medium">「無限有限公司」</text>
      <text x="60" y="101" class="tiny">剛剛</text>
    </g>
  </defs>

  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="52" class="spec">NOTIFICATION / READ ACTIONS / INTERACTION STATES</text>
  <text x="40" y="84" class="body" fill="#697287">單筆操作只鎖定目標通知；全部已讀會暫停所有已讀操作。成功後原地更新，不關閉通知選單。</text>

  <g id="single-default" transform="translate(40 132)">
    <text y="-16" class="title">Single / Default</text>
    <rect width="320" height="330" rx="18" fill="#FFFFFF" stroke="#D7DCE5" filter="url(#shadow)"/>
    <text x="16" y="38" class="h2">通知</text><rect x="72" y="18" width="72" height="24" rx="12" fill="#FCE5DF"/><text x="108" y="34" text-anchor="middle" class="label" fill="#9F3F2C">2 則未讀</text>
    <rect x="188" y="12" width="116" height="40" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/><text x="246" y="37" text-anchor="middle" class="small medium">全部設為已讀</text><line x1="16" y1="64" x2="304" y2="64" stroke="#D7DCE5"/>
    <g transform="translate(16 78)"><rect width="288" height="132" rx="12" fill="#FCE5DF" stroke="#DF6E51"/><use href="#notification-copy"/><circle cx="222" cy="32" r="4" fill="#DF6E51"/><rect x="236" y="10" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#E8B8AB"/><g transform="translate(246 20)" color="#9F3F2C"><use href="#check-check"/></g></g>
    <rect x="160" y="224" width="144" height="30" rx="7" fill="#29324A"/><text x="232" y="244" text-anchor="middle" class="tiny inverse">標記為已讀</text>
    <text x="16" y="290" class="tiny">aria-label：標記為已讀</text><text x="16" y="310" class="tiny">桌面 hover／focus 顯示 tooltip</text>
  </g>

  <g id="single-processing" transform="translate(400 132)">
    <text y="-16" class="title">Single / Processing</text>
    <rect width="320" height="330" rx="18" fill="#FFFFFF" stroke="#D7DCE5" filter="url(#shadow)"/>
    <text x="16" y="38" class="h2">通知</text><rect x="72" y="18" width="72" height="24" rx="12" fill="#FCE5DF"/><text x="108" y="34" text-anchor="middle" class="label" fill="#9F3F2C">2 則未讀</text>
    <rect x="188" y="12" width="116" height="40" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/><text x="246" y="37" text-anchor="middle" class="small medium">全部設為已讀</text><line x1="16" y1="64" x2="304" y2="64" stroke="#D7DCE5"/>
    <g transform="translate(16 78)"><rect width="288" height="132" rx="12" fill="#FCE5DF" stroke="#DF6E51"/><use href="#notification-copy"/><circle cx="222" cy="32" r="4" fill="#DF6E51"/><rect x="236" y="10" width="40" height="40" rx="9" fill="#E8B8AB"/><g transform="translate(246 20)" color="#F7F8FA"><use href="#spinner"/></g></g>
    <text x="16" y="246" class="small medium">正在標記這則通知…</text><text x="16" y="272" class="tiny">只停用目標按鈕，列表保持可閱讀</text>
    <text x="16" y="306" class="tiny">aria-busy=true</text>
  </g>

  <g id="single-success" transform="translate(760 132)">
    <text y="-16" class="title">Single / Read</text>
    <rect width="320" height="330" rx="18" fill="#FFFFFF" stroke="#D7DCE5" filter="url(#shadow)"/>
    <text x="16" y="38" class="h2">通知</text><rect x="72" y="18" width="72" height="24" rx="12" fill="#FCE5DF"/><text x="108" y="34" text-anchor="middle" class="label" fill="#9F3F2C">1 則未讀</text>
    <rect x="188" y="12" width="116" height="40" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/><text x="246" y="37" text-anchor="middle" class="small medium">全部設為已讀</text><line x1="16" y1="64" x2="304" y2="64" stroke="#D7DCE5"/>
    <g transform="translate(16 78)"><rect width="288" height="132" rx="12" fill="#FFFFFF" stroke="#D7DCE5"/><circle cx="32" cy="34" r="18" fill="#A9D2C8"/><text x="32" y="39" text-anchor="middle" class="body medium">J</text><text x="60" y="25" class="label" fill="#697287">工作區邀請</text><text x="60" y="54" class="small medium">Jeffery 邀請你加入</text><text x="60" y="75" class="small medium">「無限有限公司」</text><text x="60" y="101" class="tiny">剛剛 · 已讀</text></g>
    <rect x="16" y="226" width="288" height="52" rx="10" fill="#E3F1EC"/><g transform="translate(32 242)" color="#31665D"><use href="#check-check"/></g><text x="62" y="258" class="small medium" fill="#31665D">已標記為已讀</text>
    <text x="16" y="310" class="tiny">焦點移到下一個合理操作</text>
  </g>

  <g id="all-processing" transform="translate(1120 132)">
    <text y="-16" class="title">All / Processing</text>
    <rect width="320" height="330" rx="18" fill="#FFFFFF" stroke="#D7DCE5" filter="url(#shadow)"/>
    <text x="16" y="38" class="h2">通知</text><rect x="72" y="18" width="72" height="24" rx="12" fill="#FCE5DF"/><text x="108" y="34" text-anchor="middle" class="label" fill="#9F3F2C">2 則未讀</text>
    <rect x="188" y="12" width="116" height="40" rx="9" fill="#E8B8AB"/><g transform="translate(202 22)" color="#F7F8FA"><use href="#spinner"/></g><text x="258" y="37" text-anchor="middle" class="small inverse medium">處理中</text><line x1="16" y1="64" x2="304" y2="64" stroke="#D7DCE5"/>
    <g transform="translate(16 78)" opacity=".72"><rect width="288" height="132" rx="12" fill="#FCE5DF" stroke="#DF6E51"/><use href="#notification-copy"/><circle cx="222" cy="32" r="4" fill="#DF6E51"/><rect x="236" y="10" width="40" height="40" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/><g transform="translate(246 20)" color="#8B95A8"><use href="#check-check"/></g></g>
    <text x="16" y="246" class="small medium">正在將全部通知設為已讀…</text><text x="16" y="272" class="tiny">停用所有已讀操作，避免重複請求</text>
    <text x="16" y="306" class="tiny">列表不消失、不關閉 Dropdown</text>
  </g>

  <g id="all-success" transform="translate(40 540)">
    <text y="-16" class="title">All / Complete</text>
    <rect width="680" height="300" rx="18" fill="#FFFFFF" stroke="#D7DCE5" filter="url(#shadow)"/>
    <text x="16" y="38" class="h2">通知</text><rect x="82" y="18" width="78" height="24" rx="12" fill="#F7F8FA"/><text x="121" y="34" text-anchor="middle" class="label" fill="#697287">0 則未讀</text>
    <g transform="translate(520 20)" color="#31665D"><use href="#check-check"/></g><text x="616" y="36" text-anchor="middle" class="small medium" fill="#31665D">已全部讀取</text><line x1="16" y1="64" x2="664" y2="64" stroke="#D7DCE5"/>
    <g transform="translate(16 78)"><rect width="648" height="116" rx="12" fill="#FFFFFF" stroke="#D7DCE5"/><circle cx="34" cy="34" r="18" fill="#A9D2C8"/><text x="34" y="39" text-anchor="middle" class="body medium">J</text><text x="64" y="28" class="label" fill="#697287">工作區邀請</text><text x="64" y="58" class="body medium">Jeffery 邀請你加入「無限有限公司」</text><text x="64" y="88" class="tiny">剛剛 · 已讀</text></g>
    <rect x="394" y="214" width="270" height="54" rx="10" fill="#29324A"/><g transform="translate(412 232)" color="#A9D2C8"><use href="#check-check"/></g><text x="454" y="248" class="small inverse medium">已將 2 則通知設為已讀</text>
    <text x="16" y="246" class="small">Badge 同步為 0，Bell badge 隱藏。</text><text x="16" y="268" class="tiny">Toast 使用 aria-live=polite，不搶走焦點。</text>
  </g>

  <g id="read-error" transform="translate(760 540)">
    <text y="-16" class="title">Error / Recovery</text>
    <rect width="680" height="300" rx="18" fill="#FFFFFF" stroke="#D7DCE5" filter="url(#shadow)"/>
    <text x="16" y="38" class="h2">通知</text><rect x="82" y="18" width="78" height="24" rx="12" fill="#FCE5DF"/><text x="121" y="34" text-anchor="middle" class="label" fill="#9F3F2C">2 則未讀</text>
    <rect x="526" y="12" width="138" height="40" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/><g transform="translate(540 22)" color="#697287"><use href="#check-check"/></g><text x="612" y="37" text-anchor="middle" class="small medium">全部設為已讀</text><line x1="16" y1="64" x2="664" y2="64" stroke="#D7DCE5"/>
    <g transform="translate(16 78)"><rect width="648" height="116" rx="12" fill="#FCE5DF" stroke="#DF6E51"/><use href="#notification-copy"/><circle cx="578" cy="32" r="4" fill="#DF6E51"/><rect x="592" y="10" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#E8B8AB"/><g transform="translate(602 20)" color="#9F3F2C"><use href="#check-check"/></g></g>
    <rect x="340" y="214" width="324" height="54" rx="10" fill="#FCE8E5" stroke="#E8B8AB"/><g transform="translate(358 231)" color="#B33B2E"><use href="#error"/></g><text x="392" y="248" class="small medium" fill="#B33B2E">無法標記已讀，請再試一次</text>
    <text x="16" y="238" class="small">失敗時保留未讀狀態與操作。</text><text x="16" y="260" class="tiny">使用者可重試，不回滾其他成功項目。</text>
  </g>

  <g transform="translate(40 894)">
    <rect width="1400" height="66" rx="12" fill="#29324A"/>
    <text x="24" y="28" class="small inverse medium">Focus 與狀態</text><text x="24" y="49" class="tiny inverse">單筆成功後焦點移到下一個未讀操作；全部成功後焦點保留在「已全部讀取」狀態。Unread 以底色、左側 rail、文字與 dot 同時表達，不只靠顏色。</text>
  </g>
</svg>
