<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <defs>
    <filter id="surface-shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#29324A" flood-opacity=".08"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.display{font-size:28px;font-weight:750;letter-spacing:-.03em}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;letter-spacing:.04em;fill:#697287}.inverse{fill:#F7F8FA}.button{font-size:14px;font-weight:700}.medium{font-weight:700}.status{font-size:10px;font-weight:700;letter-spacing:.04em}.tab{font-size:12px;font-weight:700}
    </style>
    <g id="mark"><rect width="16" height="24" rx="4" fill="#DF6E51"/><rect x="22" y="8" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="menu-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4h16M2 10h16M2 16h16"/></g>
    <g id="plus-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></g>
    <g id="search-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></g>
    <g id="chevron-down" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 5 6 6 6-6"/></g>
    <g id="chevron-up" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 11 6-6 6 6"/></g>
    <g id="arrow-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h12M10 4l4 4-4 4"/></g>
  </defs>

  <g id="workspace-project-overview-tablet">
    <rect width="768" height="1024" rx="20" fill="#E9ECF1"/>
    <path d="M0 20Q0 0 20 0h728q20 0 20 20v44H0z" fill="#29324A"/>
    <g transform="translate(24 20)">
      <g transform="translate(0 2)" color="#F7F8FA"><use href="#menu-icon"/></g><use href="#mark" transform="translate(36 0)"/><text x="90" y="18" class="h2 inverse">Flowboard</text>
      <circle cx="696" cy="12" r="16" fill="#A9D2C8"/><text x="696" y="17" text-anchor="middle" class="body medium">J</text>
    </g>

    <g transform="translate(24 88)">
      <text class="tiny">目前工作區</text>
      <g transform="translate(0 18)">
        <rect width="720" height="52" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/><rect x="10" y="10" width="32" height="32" rx="8" fill="#DF6E51"/><text x="26" y="31" text-anchor="middle" class="body inverse medium">J</text>
        <text x="54" y="23" class="body medium">Jeffery 的工作區</text><text x="54" y="40" class="tiny">3 個專案 · 5 位成員</text><g transform="translate(686 18)" color="#697287"><use href="#chevron-down"/></g>
      </g>

      <text y="112" class="display">專案中心</text><text y="140" class="small">選取專案查看成員；進入主要看板是獨立操作。</text>
      <g transform="translate(504 96)"><rect width="216" height="44" rx="9" fill="#DF6E51"/><g transform="translate(28 14)" color="#FFF9F4"><use href="#plus-icon"/></g><text x="122" y="28" text-anchor="middle" class="button inverse">新增專案</text></g>

      <g transform="translate(0 168)">
        <rect width="720" height="100" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
        <g transform="translate(16 12)"><rect width="300" height="40" rx="9" fill="#FFFFFF" stroke="#D7DCE5"/><g transform="translate(14 12)" color="#697287"><use href="#search-icon"/></g><text x="44" y="25" class="body" fill="#8B95A8">搜尋專案</text></g>
        <g transform="translate(332 12)"><rect width="72" height="40" rx="20" fill="#29324A"/><text x="36" y="25" text-anchor="middle" class="tab inverse">全部 3</text></g>
        <g transform="translate(412 12)"><rect width="88" height="40" rx="20" fill="#FFFFFF"/><circle cx="16" cy="20" r="4" fill="#6EA99E"/><text x="56" y="25" text-anchor="middle" class="tab">進行中</text></g>
        <g transform="translate(508 12)"><rect width="80" height="40" rx="20" fill="#FFFFFF"/><circle cx="16" cy="20" r="4" fill="#E6B960"/><text x="52" y="25" text-anchor="middle" class="tab">暫停</text></g>
        <g transform="translate(596 12)"><rect width="80" height="40" rx="20" fill="#FFFFFF"/><circle cx="16" cy="20" r="4" fill="#907ECE"/><text x="52" y="25" text-anchor="middle" class="tab">完成</text></g>
        <text x="16" y="80" class="small">依最近更新排序 · 展開後才載入 Project members</text>
      </g>

      <g transform="translate(0 292)"><text class="h2">所有專案</text><text x="720" text-anchor="end" class="small">選取專案即可查看成員</text></g>
      <g id="tablet-project-expanded" transform="translate(0 320)" filter="url(#surface-shadow)">
        <rect width="720" height="330" rx="14" fill="#FFFFFF" stroke="#DF6E51" stroke-width="2"/><rect width="6" height="330" rx="3" fill="#DF6E51"/>
        <g transform="translate(24 20)"><rect width="68" height="24" rx="12" fill="#E3F1EC"/><circle cx="13" cy="12" r="4" fill="#6EA99E"/><text x="42" y="16" text-anchor="middle" class="status" fill="#31665D">進行中</text></g>
        <text x="24" y="76" class="h2">Flowboard 即時協作</text><text x="24" y="102" class="small">Socket.IO 通知與多人 Kanban 協作。</text><g transform="translate(674 22)" color="#697287"><use href="#chevron-up"/></g>
        <line x1="24" y1="124" x2="696" y2="124" stroke="#D7DCE5"/><text x="24" y="154" class="tiny">專案成員 · 展開後載入</text>
        <g transform="translate(24 170)">
          <circle cx="16" cy="16" r="16" fill="#A9D2C8"/><text x="16" y="21" text-anchor="middle" class="small medium">J</text><text x="48" y="14" class="body medium">Jeffery</text><text x="48" y="30" class="tiny">加入於 9 月 13 日</text>
          <circle cx="16" cy="60" r="16" fill="#907ECE"/><text x="16" y="65" text-anchor="middle" class="small inverse medium">M</text><text x="48" y="58" class="body medium">Mina</text><text x="48" y="74" class="tiny">加入於 9 月 13 日</text>
          <circle cx="360" cy="16" r="16" fill="#E6B960"/><text x="360" y="21" text-anchor="middle" class="small medium">A</text><text x="392" y="14" class="body medium">Alex</text><text x="392" y="30" class="tiny">加入於 9 月 14 日</text>
          <circle cx="360" cy="60" r="16" fill="#DF6E51"/><text x="360" y="65" text-anchor="middle" class="small inverse medium">L</text><text x="392" y="58" class="body medium">Lena</text><text x="392" y="74" class="tiny">加入於 9 月 14 日</text>
        </g>
        <g transform="translate(24 270)"><rect width="672" height="40" rx="9" fill="#DF6E51"/><text x="324" y="25" text-anchor="middle" class="button inverse">進入主要看板</text><g transform="translate(640 12)" color="#FFF9F4"><use href="#arrow-icon"/></g></g>
      </g>

      <g id="tablet-project-collapsed" transform="translate(0 666)">
        <rect width="720" height="132" rx="14" fill="#F7F8FA" stroke="#D7DCE5"/><rect width="6" height="132" rx="3" fill="#E6B960"/>
        <g transform="translate(24 18)"><rect width="68" height="24" rx="12" fill="#FFF1D8"/><circle cx="13" cy="12" r="4" fill="#E6B960"/><text x="42" y="16" text-anchor="middle" class="status" fill="#7A4D00">暫停中</text></g>
        <text x="24" y="72" class="h2">發佈自動化</text><text x="24" y="98" class="small">CI/CD、部署檢查與環境穩定性追蹤。</text><text x="560" y="98" class="tiny">更新於昨天</text><g transform="translate(674 88)" color="#697287"><use href="#chevron-down"/></g>
      </g>
    </g>
  </g>
</svg>
