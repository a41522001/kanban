<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="surface-shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#29324A" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec-label{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:32px;font-weight:750;letter-spacing:-.03em}.title{font-size:24px;font-weight:700}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;letter-spacing:.04em;fill:#697287}.inverse{fill:#F7F8FA}.soft{fill:#BFC7D7}.button{font-size:14px;font-weight:700;fill:#FFF9F4}.board-title{font-size:16px;font-weight:700}.metric{font-size:12px;font-weight:700;fill:#697287}
    </style>
    <g id="logo">
      <rect width="18" height="24" rx="4" fill="#DF6E51"/>
      <rect x="24" y="8" width="18" height="16" rx="4" fill="#A9D2C8"/>
      <text x="56" y="20" class="title inverse">Flowboard</text>
    </g>
    <g id="plus-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M8 2v12M2 8h12"/>
    </g>
    <g id="chevron-right" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 2 6 6-6 6"/>
    </g>
    <g id="grid-icon" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="1" y="1" width="5" height="5" rx="1"/><rect x="10" y="1" width="5" height="5" rx="1"/>
      <rect x="1" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/>
    </g>
    <g id="users-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="5" r="3"/><path d="M1 15c0-3 2-5 5-5s5 2 5 5M11 4c2 0 3 1 3 3 0 1-.5 2-1.5 2.5M12 11c2.5 0 4 1.5 4 4"/>
    </g>
  </defs>

  <!-- All layout gutters, padding and gaps follow a 4px spacing grid. -->
  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="48" class="spec-label">WORKSPACE / OVERVIEW / 1440 × 900</text>

  <g id="desktop-workspace">
    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#E9ECF1"/>
    <path d="M40 100q0-20 20-20h1400q20 0 20 20v44H40z" fill="#29324A"/>

    <g id="top-navigation" transform="translate(72 100)">
      <use href="#logo"/>
      <text x="180" y="20" class="body inverse" font-weight="700">工作區</text>
      <rect x="180" y="40" width="44" height="4" rx="2" fill="#DF6E51"/>
      <text x="256" y="20" class="body soft">最近</text>
      <rect x="1248" y="-8" width="40" height="40" rx="10" fill="#44506A"/>
      <g transform="translate(1260 4)" color="#F7F8FA"><use href="#plus-icon"/></g>
      <circle cx="1328" cy="12" r="16" fill="#A9D2C8"/>
      <text x="1328" y="17" text-anchor="middle" class="body" font-weight="700">J</text>
    </g>

    <g id="workspace-sidebar" transform="translate(72 176)">
      <text class="tiny">你的工作區</text>
      <g transform="translate(0 28)">
        <rect width="224" height="56" rx="12" fill="#29324A"/>
        <rect x="12" y="12" width="32" height="32" rx="8" fill="#DF6E51"/>
        <text x="28" y="33" text-anchor="middle" class="body inverse" font-weight="700">J</text>
        <text x="56" y="24" class="body inverse" font-weight="700">Jeffery 的工作區</text>
        <text x="56" y="42" class="tiny soft">擁有者 · 3 個專案</text>
      </g>

      <g transform="translate(0 96)" color="#697287">
        <rect width="224" height="44" rx="10" fill="#F7F8FA" stroke="#D7DCE5"/>
        <g transform="translate(16 14)" color="#697287"><use href="#plus-icon"/></g>
        <text x="48" y="27" class="body">新增工作區</text>
      </g>

      <line x1="0" y1="168" x2="224" y2="168" stroke="#CDD3DE"/>
      <text y="204" class="tiny">工作區管理</text>
      <g transform="translate(0 224)" color="#697287">
        <g transform="translate(4 2)"><use href="#users-icon"/></g>
        <text x="32" y="16" class="body">成員</text>
        <text x="212" y="16" text-anchor="end" class="small">5</text>
      </g>
      <g transform="translate(0 264)" color="#697287">
        <g transform="translate(4 2)"><use href="#grid-icon"/></g>
        <text x="32" y="16" class="body">已封存專案</text>
        <text x="212" y="16" text-anchor="end" class="small">1</text>
      </g>

      <g transform="translate(0 592)">
        <text class="tiny">工作區成員</text>
        <g transform="translate(0 20)">
          <circle cx="16" cy="16" r="16" fill="#A9D2C8"/><text x="16" y="21" text-anchor="middle" class="body" font-weight="700">J</text>
          <circle cx="48" cy="16" r="16" fill="#907ECE"/><text x="48" y="21" text-anchor="middle" class="body inverse" font-weight="700">M</text>
          <circle cx="80" cy="16" r="16" fill="#E6B960"/><text x="80" y="21" text-anchor="middle" class="body" font-weight="700">A</text>
          <circle cx="112" cy="16" r="16" fill="#D9DEE7"/><text x="112" y="21" text-anchor="middle" class="body" font-weight="700">+2</text>
        </g>
        <text y="76" class="small">5 位成員正在一起推進工作</text>
      </g>
    </g>

    <g id="workspace-content" transform="translate(328 176)">
      <text class="tiny">工作區</text>
      <text y="44" class="display">Jeffery 的工作區</text>
      <text y="76" class="body" fill="#697287">集中查看所有專案，選一個進入主要看板。</text>
      <g transform="translate(920 0)">
        <rect width="200" height="48" rx="10" fill="#B94B36"/>
        <g transform="translate(24 16)" color="#FFF9F4"><use href="#plus-icon"/></g>
        <text x="112" y="30" text-anchor="middle" class="button" fill="#FFF9F4">新增專案</text>
      </g>

      <text y="136" class="h2">最近開啟</text>
      <text x="1120" y="136" text-anchor="end" class="small" fill="#C4573E">查看全部</text>

      <g id="recent-product-board" transform="translate(0 156)" filter="url(#surface-shadow)">
        <rect width="552" height="132" rx="12" fill="#F7F8FA"/>
        <rect width="4" height="132" rx="2" fill="#DF6E51"/>
        <text x="24" y="32" class="board-title">Flowboard 即時協作</text>
        <text x="24" y="56" class="small">主要看板 · WebSocket 練習</text>
        <text x="24" y="100" class="metric">9 張卡片</text>
        <text x="108" y="100" class="small">剛剛開啟</text>
        <g transform="translate(344 28)">
          <rect width="40" height="64" rx="8" fill="#FCE5DF"/><rect x="48" width="40" height="64" rx="8" fill="#E3F1EC"/>
          <rect x="96" width="40" height="64" rx="8" fill="#FFF1D8"/><rect x="144" width="40" height="64" rx="8" fill="#E9E6F7"/>
          <rect x="8" y="12" width="24" height="4" rx="2" fill="#DF6E51"/><rect x="56" y="12" width="24" height="4" rx="2" fill="#6EA99E"/>
          <rect x="104" y="12" width="24" height="4" rx="2" fill="#E6B960"/><rect x="152" y="12" width="24" height="4" rx="2" fill="#907ECE"/>
          <rect x="8" y="28" width="24" height="20" rx="4" fill="#FFF"/><rect x="56" y="28" width="24" height="28" rx="4" fill="#FFF"/>
          <rect x="104" y="28" width="24" height="16" rx="4" fill="#FFF"/><rect x="152" y="28" width="24" height="20" rx="4" fill="#FFF"/>
        </g>
      </g>

      <g id="recent-release-board" transform="translate(568 156)" filter="url(#surface-shadow)">
        <rect width="552" height="132" rx="12" fill="#F7F8FA"/>
        <rect width="4" height="132" rx="2" fill="#A9D2C8"/>
        <text x="24" y="32" class="board-title">發佈自動化</text>
        <text x="24" y="56" class="small">主要看板 · CI/CD 與部署檢查</text>
        <text x="24" y="100" class="metric">14 張卡片</text>
        <text x="116" y="100" class="small">昨天開啟</text>
        <g transform="translate(344 28)">
          <path d="M0 20h40m16 0h40m16 0h40" stroke="#CDD3DE" stroke-width="2" stroke-linecap="round"/>
          <circle cy="20" r="8" fill="#DF6E51"/><circle cx="48" cy="20" r="8" fill="#A9D2C8"/>
          <circle cx="104" cy="20" r="8" fill="#E6B960"/><circle cx="160" cy="20" r="8" fill="#907ECE"/>
          <text y="52" class="tiny">準備</text><text x="44" y="52" class="tiny">進行</text><text x="96" y="52" class="tiny">檢視</text><text x="152" y="52" class="tiny">完成</text>
        </g>
      </g>

      <text y="352" class="h2">所有專案</text>
      <text y="376" class="small">3 個專案 · 依最近更新排序</text>

      <g id="board-product" transform="translate(0 400)" filter="url(#surface-shadow)">
        <rect width="352" height="212" rx="12" fill="#F7F8FA"/>
        <path d="M0 12Q0 0 12 0h76v4H0z" fill="#DF6E51"/><rect x="88" width="88" height="4" fill="#A9D2C8"/><rect x="176" width="88" height="4" fill="#E6B960"/><path d="M264 0h76q12 0 12 12V4h-88z" fill="#907ECE"/>
        <text x="20" y="40" class="board-title">Flowboard 即時協作</text>
        <text x="20" y="68" class="small">主要看板 · WebSocket 練習</text>
        <g transform="translate(20 92)">
          <rect width="68" height="48" rx="8" fill="#FCE5DF"/><rect x="80" width="68" height="48" rx="8" fill="#E3F1EC"/><rect x="160" width="68" height="48" rx="8" fill="#FFF1D8"/><rect x="240" width="68" height="48" rx="8" fill="#E9E6F7"/>
          <text x="34" y="20" text-anchor="middle" class="metric">3</text><text x="114" y="20" text-anchor="middle" class="metric">2</text><text x="194" y="20" text-anchor="middle" class="metric">2</text><text x="274" y="20" text-anchor="middle" class="metric">2</text>
          <rect x="16" y="28" width="36" height="4" rx="2" fill="#DF6E51"/><rect x="96" y="28" width="36" height="4" rx="2" fill="#6EA99E"/><rect x="176" y="28" width="36" height="4" rx="2" fill="#E6B960"/><rect x="256" y="28" width="36" height="4" rx="2" fill="#907ECE"/>
        </g>
        <line x1="20" y1="160" x2="332" y2="160" stroke="#D9DEE7"/>
        <text x="20" y="188" class="small">更新於 5 分鐘前</text>
        <circle cx="300" cy="184" r="12" fill="#A9D2C8"/><circle cx="320" cy="184" r="12" fill="#907ECE"/><text x="320" y="188" text-anchor="middle" class="tiny inverse">M</text>
      </g>

      <g id="board-release" transform="translate(368 400)" filter="url(#surface-shadow)">
        <rect width="352" height="212" rx="12" fill="#F7F8FA"/>
        <rect width="352" height="4" rx="2" fill="#A9D2C8"/>
        <text x="20" y="40" class="board-title">發佈自動化</text>
        <text x="20" y="68" class="small">主要看板 · CI/CD 與部署檢查</text>
        <g transform="translate(20 96)">
          <path d="M8 12h72m16 0h72m16 0h72" stroke="#CDD3DE" stroke-width="2" stroke-linecap="round"/>
          <circle cx="0" cy="12" r="8" fill="#DF6E51"/><circle cx="88" cy="12" r="8" fill="#A9D2C8"/><circle cx="176" cy="12" r="8" fill="#E6B960"/><circle cx="264" cy="12" r="8" fill="#907ECE"/>
          <text y="44" class="tiny">需求確認</text><text x="80" y="44" class="tiny">建置</text><text x="168" y="44" class="tiny">驗收</text><text x="248" y="44" class="tiny">上線</text>
        </g>
        <line x1="20" y1="160" x2="332" y2="160" stroke="#D9DEE7"/>
        <text x="20" y="188" class="small">更新於昨天</text>
        <circle cx="320" cy="184" r="12" fill="#E6B960"/><text x="320" y="188" text-anchor="middle" class="tiny">A</text>
      </g>

      <g id="board-learning" transform="translate(736 400)" filter="url(#surface-shadow)">
        <rect width="352" height="212" rx="12" fill="#F7F8FA"/>
        <rect width="352" height="4" rx="2" fill="#907ECE"/>
        <text x="20" y="40" class="board-title">技術成長計畫</text>
        <text x="20" y="68" class="small">主要看板 · .NET、AWS、系統設計</text>
        <g transform="translate(20 92)">
          <rect width="312" height="48" rx="8" fill="#E9E6F7"/>
          <text x="16" y="20" class="metric">本週進度</text>
          <rect x="16" y="28" width="280" height="6" rx="3" fill="#D9DEE7"/><rect x="16" y="28" width="184" height="6" rx="3" fill="#907ECE"/>
        </g>
        <line x1="20" y1="160" x2="332" y2="160" stroke="#D9DEE7"/>
        <text x="20" y="188" class="small">更新於 8 月 18 日</text>
        <circle cx="320" cy="184" r="12" fill="#A9D2C8"/><text x="320" y="188" text-anchor="middle" class="tiny">J</text>
      </g>

      <g transform="translate(0 648)">
        <text class="small">已封存 1 個專案</text>
        <g transform="translate(108 -12)" color="#697287"><use href="#chevron-right"/></g>
      </g>
    </g>
  </g>
</svg>
