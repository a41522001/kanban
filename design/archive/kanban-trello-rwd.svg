<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1150" viewBox="0 0 2700 1150">
  <defs>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#29324A" flood-opacity=".10"/></filter>
    <clipPath id="tablet"><rect x="940" y="80" width="768" height="1024" rx="20"/></clipPath><clipPath id="phone"><rect x="1750" y="80" width="390" height="844" rx="20"/></clipPath>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.label{font-size:19px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:28px;font-weight:750;letter-spacing:-.03em}.h1{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;letter-spacing:.05em;fill:#697287}.inverse{fill:#F7F8FA}.btn{font-size:14px;font-weight:700;fill:#FFF9F4}.card-title{font-size:14px;font-weight:650}
    </style>
    <g id="mark"><rect width="16" height="23" rx="4" fill="#DF6E51"/><rect x="22" y="7" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="mobile-card" filter="url(#s)"><rect width="262" height="126" rx="9" fill="#FFF"/><rect x="14" y="14" width="48" height="20" rx="10" fill="#FCE5DF"/><text x="38" y="28" text-anchor="middle" class="tiny" fill="#A9432E">API</text><text x="14" y="58" class="card-title">建立使用者註冊 API</text><text x="14" y="82" class="small">Auth · Backend</text></g>
  </defs>
  <!-- Page and board bases are deliberately shared with desktop: #F7F8FA and #E9ECF1. -->
  <rect width="2700" height="1150" fill="#E9ECF1"/>

  <text x="40" y="48" class="label">MOBILE / LOGIN / 390 × 844</text>
  <g id="mobile-login">
    <rect x="40" y="80" width="390" height="844" rx="20" fill="#F7F8FA"/>
    <g transform="translate(68 116)"><use href="#mark"/><text x="50" y="19" class="h2">Flowboard</text></g><rect x="68" y="164" width="42" height="4" rx="2" fill="#DF6E51"/>
    <g transform="translate(64 202)"><text class="display">回到正在推進的工作</text><text y="34" class="body" fill="#697287">登入後，接續上次停下的地方。</text><text y="100" class="body" font-weight="700">電子郵件</text><rect y="116" width="342" height="48" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="146" class="body" fill="#8B95A8">you@example.com</text><text y="208" class="body" font-weight="700">密碼</text><rect y="224" width="342" height="48" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="254" class="body" fill="#8B95A8">••••••••••••</text><text x="342" y="306" text-anchor="end" class="body" fill="#C4573E">忘記密碼？</text><rect y="340" width="342" height="50" rx="9" fill="#DF6E51"/><text x="171" y="371" text-anchor="middle" class="btn">登入 Flowboard</text><line x1="0" y1="438" x2="342" y2="438" stroke="#D9DEE7"/><rect x="151" y="426" width="40" height="24" fill="#F7F8FA"/><text x="171" y="443" text-anchor="middle" class="small">或</text><rect y="478" width="342" height="48" rx="9" fill="#FFF" stroke="#CDD3DE"/><circle cx="113" cy="502" r="10" fill="#29324A"/><text x="133" y="507" class="body" font-weight="700">使用 Google 繼續</text><text x="171" y="598" text-anchor="middle" class="body">第一次使用？ <tspan fill="#C4573E" font-weight="700">建立帳號</tspan></text></g>
    <text x="68" y="890" class="tiny">FLOWBOARD / REAL-TIME COLLABORATION</text>
  </g>

  <text x="470" y="48" class="label">MOBILE / SIGNUP / 390 × 844</text>
  <g id="mobile-signup">
    <rect x="470" y="80" width="390" height="844" rx="20" fill="#F7F8FA"/><g transform="translate(498 112)"><use href="#mark"/><text x="50" y="19" class="h2">Flowboard</text></g>
    <g transform="translate(494 170)"><rect width="42" height="4" rx="2" fill="#DF6E51"/><text y="48" class="display">建立你的工作區</text><text y="80" class="body" fill="#697287">從第一張卡片，開始建立節奏。</text><text y="132" class="body" font-weight="700">顯示名稱</text><rect y="148" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="176" class="body" fill="#8B95A8">例如：Jeffery</text><text y="230" class="body" font-weight="700">電子郵件</text><rect y="246" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="274" class="body" fill="#8B95A8">you@example.com</text><text y="328" class="body" font-weight="700">密碼</text><rect y="344" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="372" class="body" fill="#8B95A8">至少 8 個字元</text><rect y="402" width="80" height="4" rx="2" fill="#6EA99E"/><rect x="87" y="402" width="80" height="4" rx="2" fill="#6EA99E"/><rect x="174" y="402" width="80" height="4" rx="2" fill="#D9DEE7"/><rect x="261" y="402" width="80" height="4" rx="2" fill="#D9DEE7"/><text y="434" class="body" font-weight="700">確認密碼</text><rect y="450" width="342" height="44" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="478" class="body" fill="#8B95A8">再次輸入密碼</text><rect y="524" width="18" height="18" rx="4" fill="#29324A"/><path d="M4 533l4 4 7-8" stroke="#FFF" stroke-width="2" fill="none"/><text x="30" y="538" class="small">我同意服務條款與隱私權政策</text><rect y="572" width="342" height="50" rx="9" fill="#DF6E51"/><text x="171" y="603" text-anchor="middle" class="btn">建立工作區</text><text x="171" y="674" text-anchor="middle" class="body">已經有帳號？ <tspan fill="#C4573E" font-weight="700">返回登入</tspan></text></g>
  </g>

  <text x="940" y="48" class="label">TABLET / BOARD / 768 × 1024</text>
  <g id="tablet-board" clip-path="url(#tablet)">
    <rect x="940" y="80" width="768" height="1024" rx="20" fill="#E9ECF1"/><rect x="940" y="80" width="768" height="58" fill="#29324A"/>
    <g transform="translate(968 98)"><use href="#mark"/><text x="47" y="17" class="h2 inverse">Flowboard</text><circle cx="640" cy="10" r="15" fill="#A9D2C8"/><text x="640" y="14" text-anchor="middle" class="small">J</text></g><g transform="translate(968 164)"><text class="h1">產品開發看板</text><text y="27" class="small">WebSocket 練習專案</text><path d="M560 10h28m12 0h28" stroke="#AAB3C2" stroke-width="2"/><circle cx="550" cy="10" r="6" fill="#DF6E51"/><circle cx="598" cy="10" r="6" fill="#A9D2C8"/><circle cx="646" cy="10" r="6" fill="#E6B960"/></g>
    <g transform="translate(968 230)"><rect width="280" height="824" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/><rect x="14" y="18" width="5" height="28" rx="2.5" fill="#DF6E51"/><text x="32" y="37" class="h2">準備開始</text><text x="248" y="37" class="small">03</text><g transform="translate(12 62)" filter="url(#s)"><rect width="256" height="128" rx="9" fill="#FFF"/><text x="14" y="48" class="card-title">建立使用者註冊 API</text><text x="14" y="74" class="small">Auth · Backend</text></g><g transform="translate(12 202)" filter="url(#s)"><rect width="256" height="112" rx="9" fill="#FFF"/><text x="14" y="48" class="card-title">登入頁表單驗證</text><text x="14" y="74" class="small">Frontend</text></g></g>
    <g transform="translate(1264 230)"><rect width="280" height="824" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/><rect x="14" y="18" width="5" height="28" rx="2.5" fill="#A9D2C8"/><text x="32" y="37" class="h2">正在進行</text><g transform="translate(12 62)" filter="url(#s)"><rect width="256" height="142" rx="9" fill="#FFF"/><text x="14" y="48" class="card-title">Session Cookie 驗證流程</text><text x="14" y="74" class="small">Redis · Auth</text><rect x="14" y="98" width="116" height="6" rx="3" fill="#DFE4E9"/><rect x="14" y="98" width="72" height="6" rx="3" fill="#6EA99E"/></g></g><rect x="1232" y="1072" width="180" height="4" rx="2" fill="#C4CBD7"/><rect x="1232" y="1072" width="84" height="4" rx="2" fill="#29324A"/>
  </g>

  <text x="1750" y="48" class="label">MOBILE / BOARD / 390 × 844</text>
  <g id="mobile-board" clip-path="url(#phone)">
    <rect x="1750" y="80" width="390" height="844" rx="20" fill="#E9ECF1"/><rect x="1750" y="80" width="390" height="56" fill="#29324A"/><g transform="translate(1770 97)"><use href="#mark"/><text x="44" y="16" class="h2 inverse">Flowboard</text><circle cx="318" cy="9" r="15" fill="#A9D2C8"/><text x="318" y="14" text-anchor="middle" class="small">J</text></g><g transform="translate(1770 158)"><text class="h1">產品開發看板</text><text y="25" class="small">WebSocket 練習專案</text><text x="340" y="14" text-anchor="end" class="h1">•••</text></g>
    <g transform="translate(1770 220)"><rect width="286" height="650" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/><rect x="14" y="18" width="5" height="28" rx="2.5" fill="#DF6E51"/><text x="32" y="37" class="h2">準備開始</text><text x="254" y="37" class="small">03</text><use href="#mobile-card" transform="translate(12 62)"/><g transform="translate(12 200)" filter="url(#s)"><rect width="262" height="112" rx="9" fill="#FFF"/><text x="14" y="48" class="card-title">登入頁表單驗證</text><text x="14" y="74" class="small">Frontend</text></g><g transform="translate(12 324)" filter="url(#s)"><rect width="262" height="96" rx="9" fill="#FFF"/><text x="14" y="40" class="card-title">整理 Socket.IO 事件命名</text><text x="14" y="66" class="small">文件 · 8 月 16 日</text></g></g><g transform="translate(2072 220)"><rect width="286" height="650" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/><rect x="14" y="18" width="5" height="28" rx="2.5" fill="#A9D2C8"/><text x="32" y="37" class="h2">正在進行</text></g><rect x="1848" y="898" width="194" height="4" rx="2" fill="#C4CBD7"/><rect x="1848" y="898" width="94" height="4" rx="2" fill="#29324A"/>
  </g>

  <text x="2180" y="48" class="label">MOBILE / CARD DETAIL / 390 × 844</text>
  <g id="mobile-card-detail">
    <rect x="2180" y="80" width="390" height="844" rx="20" fill="#F7F8FA"/><g transform="translate(2204 112)"><text class="h1">‹</text><text x="44" class="small">正在進行</text><text x="338" text-anchor="end" class="h1">×</text></g>
    <g transform="translate(2204 168)"><rect width="62" height="22" rx="11" fill="#E3F1EC"/><text x="31" y="15" text-anchor="middle" class="tiny" fill="#3E756B">進行中</text><text y="62" class="display">Session Cookie</text><text y="94" class="display">驗證流程</text><text y="126" class="small">位於「正在進行」</text><line x1="0" y1="156" x2="342" y2="156" stroke="#D7DCE5"/><text y="198" class="body" font-weight="700">描述</text><text y="230" class="body">Cookie 保存隨機 session id；</text><text y="256" class="body">Redis 保存雜湊後的 session key。</text><text y="318" class="body" font-weight="700">Checklist</text><rect y="340" width="20" height="20" rx="5" fill="#6EA99E"/><path d="M5 350l4 4 7-8" stroke="#FFF" stroke-width="2" fill="none"/><text x="32" y="355" class="body">Session repository 完成</text><rect y="376" width="20" height="20" rx="5" fill="#6EA99E"/><path d="M5 386l4 4 7-8" stroke="#FFF" stroke-width="2" fill="none"/><text x="32" y="391" class="body">Cookie 設定完成</text><rect y="412" width="20" height="20" rx="5" fill="#FFF" stroke="#AAB3C2"/><text x="32" y="427" class="body">Socket handshake 驗證</text></g><rect x="2204" y="820" width="342" height="52" rx="9" fill="#29324A"/><text x="2375" y="852" text-anchor="middle" class="btn">移動卡片</text>
  </g>
</svg>
