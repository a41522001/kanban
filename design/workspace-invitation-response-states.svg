<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#29324A" flood-opacity=".14"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.title{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.03em}.inverse{fill:#F7F8FA}.medium{font-weight:700}
    </style>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3.2 3.2L13 4.5"/></g>
    <g id="x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></g>
    <g id="alert" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="7"/><path d="M8 4.5v4.2M8 11.5h.01"/></g>
  </defs>

  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="52" class="spec">WORKSPACE INVITATION DETAIL DIALOG / STATES</text>
  <text x="40" y="84" class="body" fill="#697287">由 notificationId 載入最新邀請詳情；通知只管理已讀，邀請 Dialog 管理回覆與資源狀態。</text>

  <g id="loading" transform="translate(40 132)">
    <text y="-16" class="title">Loading detail</text>
    <rect width="440" height="330" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><rect width="440" height="6" rx="3" fill="#DF6E51"/>
    <circle cx="38" cy="46" r="20" fill="#FCE5DF"/><rect x="70" y="29" width="148" height="14" rx="7" fill="#D7DCE5"/><rect x="70" y="52" width="220" height="10" rx="5" fill="#E3E6EC"/>
    <rect x="24" y="92" width="392" height="106" rx="14" fill="#F7F8FA"/><circle cx="62" cy="130" r="22" fill="#D7DCE5"/><rect x="98" y="112" width="180" height="12" rx="6" fill="#D7DCE5"/><rect x="98" y="136" width="246" height="10" rx="5" fill="#E3E6EC"/><rect x="98" y="158" width="204" height="10" rx="5" fill="#E3E6EC"/>
    <rect x="24" y="222" width="392" height="48" rx="10" fill="#E3E6EC"/>
    <text x="24" y="306" class="tiny">Dialog 保持開啟；讀取失敗時切換 Unavailable</text>
  </g>

  <g id="pending" transform="translate(520 132)">
    <text y="-16" class="title">Pending</text>
    <rect width="440" height="330" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><rect width="440" height="6" rx="3" fill="#DF6E51"/>
    <circle cx="38" cy="46" r="20" fill="#FCE5DF"/><text x="72" y="43" class="h2">工作區邀請</text><text x="72" y="62" class="tiny">等待你的回覆</text>
    <g transform="translate(24 92)"><rect width="392" height="112" rx="14" fill="#FFF9F7" stroke="#E8B8AB"/><circle cx="42" cy="42" r="22" fill="#DF6E51"/><text x="42" y="47" text-anchor="middle" class="body inverse medium">M</text><text x="78" y="34" class="small">Mia 邀請你加入</text><text x="78" y="62" class="h2">產品開發中心</text><text x="78" y="86" class="tiny">成員 · 7 天後到期</text></g>
    <rect x="24" y="224" width="188" height="48" rx="10" fill="#FFFFFF" stroke="#CDD3DE"/><text x="118" y="254" text-anchor="middle" class="body medium">婉拒</text>
    <rect x="228" y="224" width="188" height="48" rx="10" fill="#DF6E51"/><text x="322" y="254" text-anchor="middle" class="body inverse medium">接受邀請</text>
    <text x="24" y="306" class="tiny">接受是唯一主要操作；婉拒保持中性</text>
  </g>

  <g id="responding" transform="translate(1000 132)">
    <text y="-16" class="title">Responding</text>
    <rect width="440" height="330" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><rect width="440" height="6" rx="3" fill="#DF6E51"/>
    <circle cx="38" cy="46" r="20" fill="#FCE5DF"/><text x="72" y="43" class="h2">工作區邀請</text><text x="72" y="62" class="tiny">正在處理</text>
    <g transform="translate(24 92)"><rect width="392" height="112" rx="14" fill="#FFF9F7" stroke="#E8B8AB"/><circle cx="42" cy="42" r="22" fill="#DF6E51"/><text x="42" y="47" text-anchor="middle" class="body inverse medium">M</text><text x="78" y="35" class="small">正在接受邀請</text><text x="78" y="62" class="h2">產品開發中心</text><text x="78" y="86" class="tiny">請稍候，不需要重複操作</text></g>
    <rect x="24" y="224" width="188" height="48" rx="10" fill="#F7F8FA" stroke="#D7DCE5"/><text x="118" y="254" text-anchor="middle" class="body" fill="#8B95A8">婉拒</text>
    <rect x="228" y="224" width="188" height="48" rx="10" fill="#E8B8AB"/><circle cx="267" cy="248" r="7" fill="none" stroke="#F7F8FA" stroke-width="2" stroke-dasharray="16 7"/><text x="332" y="254" text-anchor="middle" class="body inverse medium">接受中</text>
    <text x="24" y="306" class="tiny">兩個動作皆 disabled；aria-live 宣告處理狀態</text>
  </g>

  <g id="accepted" transform="translate(40 562)">
    <text y="-16" class="title">Accepted</text>
    <rect width="440" height="330" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><rect width="440" height="6" rx="3" fill="#A9D2C8"/>
    <circle cx="38" cy="46" r="20" fill="#E3F1EC"/><g transform="translate(30 38)" color="#31665D"><use href="#check"/></g><text x="72" y="43" class="h2" fill="#31665D">邀請已接受</text><text x="72" y="62" class="tiny">已完成回覆</text>
    <g transform="translate(24 92)"><rect width="392" height="112" rx="14" fill="#F5FAF8" stroke="#A9D2C8"/><text x="20" y="35" class="small">你已加入</text><text x="20" y="64" class="h2">產品開發中心</text><text x="20" y="88" class="small">工作區已加入你的列表。</text></g>
    <rect x="24" y="224" width="392" height="48" rx="10" fill="#29324A"/><text x="220" y="254" text-anchor="middle" class="body inverse medium">前往工作區</text>
    <text x="24" y="306" class="tiny">再次開啟通知時，由 detail API 還原此狀態</text>
  </g>

  <g id="declined" transform="translate(520 562)">
    <text y="-16" class="title">Declined</text>
    <rect width="440" height="330" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><rect width="440" height="6" rx="3" fill="#CDD3DE"/>
    <circle cx="38" cy="46" r="20" fill="#F7F8FA"/><g transform="translate(30 38)" color="#697287"><use href="#x"/></g><text x="72" y="43" class="h2">邀請已婉拒</text><text x="72" y="62" class="tiny">已完成回覆</text>
    <g transform="translate(24 92)"><rect width="392" height="112" rx="14" fill="#F7F8FA" stroke="#D7DCE5"/><text x="20" y="35" class="small">你已婉拒加入</text><text x="20" y="64" class="h2">產品開發中心</text><text x="20" y="88" class="small">這則邀請不再提供回覆操作。</text></g>
    <rect x="24" y="224" width="392" height="48" rx="10" fill="#FFFFFF" stroke="#CDD3DE"/><text x="220" y="254" text-anchor="middle" class="body medium">關閉</text>
    <text x="24" y="306" class="tiny">婉拒不使用 danger 色；重新整理後仍由詳情還原</text>
  </g>

  <g id="unavailable" transform="translate(1000 562)">
    <text y="-16" class="title">Unavailable / Expired</text>
    <rect width="440" height="330" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><rect width="440" height="6" rx="3" fill="#E6B960"/>
    <circle cx="38" cy="46" r="20" fill="#FFF4D8"/><g transform="translate(30 38)" color="#8A651D"><use href="#alert"/></g><text x="72" y="43" class="h2">這則邀請已無法回覆</text><text x="72" y="62" class="tiny">邀請可能已過期或被取消</text>
    <g transform="translate(24 92)"><rect width="392" height="112" rx="14" fill="#FFFBF1" stroke="#E6B960"/><text x="20" y="38" class="h2">產品開發中心</text><text x="20" y="68" class="small">通知仍保留為歷史紀錄，</text><text x="20" y="89" class="small">但不再提供接受或婉拒操作。</text></g>
    <rect x="24" y="224" width="392" height="48" rx="10" fill="#FFFFFF" stroke="#CDD3DE"/><text x="220" y="254" text-anchor="middle" class="body medium">關閉</text>
    <text x="24" y="306" class="tiny">資源不存在、取消與過期皆需穩定的非操作狀態</text>
  </g>
</svg>
