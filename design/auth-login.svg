<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="40 80 1440 900">
<defs>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#29324A" flood-opacity=".10"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.label{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:38px;font-weight:750;letter-spacing:-.03em}.title{font-size:25px;font-weight:700}.body{font-size:15px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;letter-spacing:.05em;fill:#697287}.inverse{fill:#F7F8FA}.soft{fill:#BFC7D7}.btn{font-size:14px;font-weight:700;fill:#FFF9F4}.card-title{font-size:14px;font-weight:650}.col{font-size:14px;font-weight:700}.chip{font-size:11px;font-weight:700}
    </style>
    <g id="logo"><rect width="18" height="25" rx="4" fill="#DF6E51"/><rect x="24" y="8" width="18" height="17" rx="4" fill="#A9D2C8"/><text x="56" y="21" class="title inverse">Flowboard</text></g>
    <g id="flow"><path d="M8 10h36m12 0h36m12 0h36" stroke="#AAB3C2" stroke-width="2" stroke-linecap="round"/><circle cx="0" cy="10" r="7" fill="#DF6E51"/><circle cx="48" cy="10" r="7" fill="#A9D2C8"/><circle cx="96" cy="10" r="7" fill="#E6B960"/><circle cx="144" cy="10" r="7" fill="#907ECE"/></g>
    <g id="card-a" filter="url(#s)"><rect width="246" height="126" rx="9" fill="#FFF"/><rect x="14" y="14" width="48" height="20" rx="10" fill="#FCE5DF"/><text x="38" y="28" text-anchor="middle" class="chip" fill="#A9432E">API</text><text x="14" y="58" class="card-title">建立使用者註冊 API</text><text x="14" y="82" class="small">Auth · Backend</text><circle cx="220" cy="98" r="13" fill="#907ECE"/><text x="220" y="102" text-anchor="middle" class="small inverse">J</text></g>
    <g id="card-b" filter="url(#s)"><rect width="246" height="118" rx="9" fill="#FFF"/><rect x="14" y="14" width="64" height="20" rx="10" fill="#E3F1EC"/><text x="46" y="28" text-anchor="middle" class="chip" fill="#3E756B">Session</text><text x="14" y="58" class="card-title">Session Cookie 驗證流程</text><text x="14" y="82" class="small">Redis · Auth</text><rect x="14" y="98" width="116" height="6" rx="3" fill="#DFE4E9"/><rect x="14" y="98" width="72" height="6" rx="3" fill="#6EA99E"/></g>
  </defs>
<g id="desktop-login">
    <rect x="40" y="80" width="1440" height="900" rx="18" fill="#F7F8FA"/>
    <path d="M40 98q0-18 18-18h482v900H58q-18 0-18-18z" fill="#29324A"/>
    <use href="#logo" transform="translate(96 136)"/>
    <g transform="translate(96 310)">
      <text class="display inverse">不只同步訊息，</text><text y="48" class="display inverse">也同步下一步。</text>
      <text y="92" class="body soft">把工作切成能推進的小塊，讓每個人看見流程正在往哪裡走。</text>
      <g transform="translate(0 145)"><use href="#flow"/><rect y="40" width="114" height="70" rx="9" fill="#36405A"/><rect x="134" y="40" width="114" height="70" rx="9" fill="#F7F8FA"/><rect x="268" y="40" width="114" height="70" rx="9" fill="#36405A"/><rect x="18" y="58" width="58" height="7" rx="3" fill="#F7F8FA"/><rect x="152" y="58" width="58" height="7" rx="3" fill="#29324A"/><rect x="286" y="58" width="58" height="7" rx="3" fill="#F7F8FA"/><rect x="18" y="80" width="76" height="5" rx="3" fill="#BFC7D7"/><rect x="152" y="80" width="76" height="5" rx="3" fill="#9AA4B8"/><rect x="286" y="80" width="76" height="5" rx="3" fill="#BFC7D7"/></g>
      <circle cx="8" cy="328" r="4" fill="#DF6E51"/><text x="24" y="333" class="body inverse">讓團隊看見狀態，而不是追問狀態</text>
      <circle cx="8" cy="364" r="4" fill="#A9D2C8"/><text x="24" y="369" class="body inverse">每一次異動都有清楚的下一步</text>
    </g>
    <text x="96" y="928" class="tiny soft">FLOWBOARD / REAL-TIME COLLABORATION</text>
    <!-- Open form surface: no floating marketing-card treatment. -->
    <g transform="translate(790 228)">
      <text class="tiny">登入你的工作區</text><text y="50" class="display">回到正在推進的工作</text><text y="84" class="body" fill="#697287">輸入帳號後，繼續上次停下的地方。</text>
      <text y="148" class="body" font-weight="700">電子郵件</text><rect y="164" width="450" height="50" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="16" y="195" class="body" fill="#8B95A8">you@example.com</text>
      <text y="266" class="body" font-weight="700">密碼</text><rect y="282" width="450" height="50" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="16" y="313" class="body" fill="#8B95A8">••••••••••••</text><text x="450" y="358" text-anchor="end" class="body" fill="#C4573E">忘記密碼？</text>
      <rect y="392" width="450" height="52" rx="9" fill="#DF6E51"/><text x="225" y="424" text-anchor="middle" class="btn">登入 Flowboard</text>
      <line x1="0" y1="494" x2="450" y2="494" stroke="#D9DEE7"/><rect x="205" y="482" width="40" height="24" fill="#F7F8FA"/><text x="225" y="499" text-anchor="middle" class="small">或</text>
      <rect y="534" width="450" height="50" rx="9" fill="#FFF" stroke="#CDD3DE"/><circle cx="190" cy="559" r="10" fill="#29324A"/><text x="210" y="564" class="body" font-weight="700">使用 Google 繼續</text><text x="225" y="656" text-anchor="middle" class="body">第一次使用？ <tspan fill="#C4573E" font-weight="700">建立帳號</tspan></text>
    </g>
  </g>
</svg>