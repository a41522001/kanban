<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <filter id="surface-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#111827" flood-opacity=".22"/>
    </filter>
    <linearGradient id="photo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B8AB"/>
      <stop offset="1" stop-color="#FFF1D8"/>
    </linearGradient>
    <clipPath id="crop-area"><rect width="326" height="300" rx="12"/></clipPath>
    <clipPath id="preview-64"><circle cx="32" cy="32" r="32"/></clipPath>
    <clipPath id="preview-32"><circle cx="16" cy="16" r="16"/></clipPath>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.title{font-size:22px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:10px;letter-spacing:.04em;fill:#697287}.inverse{fill:#F7F8FA}.button{font-size:14px;font-weight:700}.medium{font-weight:700}
    </style>
    <g id="mark"><rect width="16" height="24" rx="4" fill="#DF6E51"/><rect x="22" y="8" width="16" height="16" rx="4" fill="#A9D2C8"/></g>
    <g id="plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></g>
    <g id="minus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8h12"/></g>
    <g id="close" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l12 12M15 3 3 15"/></g>
    <g id="refresh" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8a6 6 0 1 1-1.8-4.3M14 2v4h-4"/></g>
    <!-- Sample photo: stands in for the user's uploaded image -->
    <g id="photo">
      <rect width="600" height="420" fill="url(#photo-sky)"/>
      <circle cx="460" cy="96" r="44" fill="#FFF9F4" opacity=".8"/>
      <path d="M0 300 140 210 250 270 380 190 600 300v120H0z" fill="#6EA99E"/>
      <path d="M0 350 180 290 330 340 470 300 600 350v70H0z" fill="#31665D"/>
      <circle cx="300" cy="182" r="58" fill="#E6B960"/>
      <path d="M200 420c0-120 44-186 100-186s100 66 100 186z" fill="#DF6E51"/>
    </g>
  </defs>

  <rect width="390" height="844" rx="20" fill="#E9ECF1"/>
  <path d="M0 20Q0 0 20 0h350q20 0 20 20v36H0z" fill="#29324A"/>
  <g transform="translate(20 16)">
    <use href="#mark" transform="scale(.84)"/>
    <text x="48" y="18" class="h2 inverse">Flowboard</text>
    <rect x="278" y="-8" width="40" height="40" rx="10" fill="#44506A"/>
    <g transform="translate(290 4)" color="#F7F8FA"><use href="#plus"/></g>
    <circle cx="350" cy="12" r="16" fill="#A9D2C8"/><text x="350" y="17" text-anchor="middle" class="body medium">J</text>
  </g>
  <g transform="translate(24 80)">
    <rect y="20" width="342" height="56" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
    <text y="120" class="title">選一個專案繼續</text>
    <rect y="172" width="342" height="48" rx="10" fill="#C4573E"/>
    <rect y="280" width="342" height="132" rx="12" fill="#F7F8FA"/>
    <rect y="432" width="342" height="132" rx="12" fill="#F7F8FA"/>
  </g>

  <rect width="390" height="844" rx="20" fill="#172033" opacity=".58"/>

  <g id="dialog" transform="translate(16 66)" filter="url(#surface-shadow)">
    <rect width="358" height="712" rx="18" fill="#FFFFFF"/>
    <text x="16" y="44" class="title">更換頭像</text>
    <rect x="302" y="16" width="40" height="40" rx="9" fill="#F7F8FA"/>
    <g transform="translate(313 27)" color="#697287"><use href="#close"/></g>
    <text x="16" y="76" class="body" fill="#697287">拖曳調整位置，雙指或滑桿縮放。</text>

    <g id="cropper" transform="translate(16 96)">
      <g clip-path="url(#crop-area)">
        <rect width="326" height="300" fill="#182033"/>
        <use href="#photo" transform="translate(-137 -60)"/>
        <path fill="#182033" fill-opacity=".62" fill-rule="evenodd" d="M0 0h326v300H0z M163 30a120 120 0 1 0 0.01 0z"/>
      </g>
      <circle cx="163" cy="150" r="120" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="163" cy="30" r="6" fill="#FFFFFF"/>
      <circle cx="283" cy="150" r="6" fill="#FFFFFF"/>
      <circle cx="163" cy="270" r="6" fill="#FFFFFF"/>
      <circle cx="43" cy="150" r="6" fill="#FFFFFF"/>
    </g>

    <g id="zoom" transform="translate(16 412)">
      <rect width="44" height="44" rx="10" fill="#F7F8FA"/>
      <g transform="translate(14 14)" color="#29324A"><use href="#minus"/></g>
      <rect x="60" y="20" width="206" height="4" rx="2" fill="#D7DCE5"/>
      <rect x="60" y="20" width="82" height="4" rx="2" fill="#DF6E51"/>
      <circle cx="142" cy="22" r="11" fill="#FFFFFF" stroke="#DF6E51" stroke-width="2"/>
      <rect x="282" width="44" height="44" rx="10" fill="#F7F8FA"/>
      <g transform="translate(296 14)" color="#29324A"><use href="#plus"/></g>
    </g>

    <g id="preview" transform="translate(16 476)">
      <g>
        <g clip-path="url(#preview-64)"><use href="#photo" transform="translate(-48 -24) scale(.2667)"/></g>
        <circle cx="32" cy="32" r="32" fill="none" stroke="#D7DCE5"/>
      </g>
      <g transform="translate(76 16)">
        <g clip-path="url(#preview-32)"><use href="#photo" transform="translate(-24 -12) scale(.1333)"/></g>
        <circle cx="16" cy="16" r="16" fill="none" stroke="#D7DCE5"/>
      </g>
      <text x="124" y="28" class="small">實際顯示</text>
      <text x="124" y="46" class="small">JPG、PNG、WebP，5 MB 以內</text>
    </g>

    <line x1="16" y1="560" x2="342" y2="560" stroke="#D7DCE5"/>
    <g transform="translate(16 576)">
      <rect width="157" height="48" rx="10" fill="#FFFFFF" stroke="#D7DCE5"/>
      <g transform="translate(26 16)" color="#697287"><use href="#refresh"/></g>
      <text x="90" y="30" text-anchor="middle" class="button" fill="#697287">重新選擇</text>
      <rect x="169" width="157" height="48" rx="10" fill="#FFFFFF" stroke="#D7DCE5"/>
      <text x="247.5" y="30" text-anchor="middle" class="button">取消</text>
    </g>
    <rect x="16" y="636" width="326" height="48" rx="10" fill="#DF6E51"/>
    <text x="179" y="666" text-anchor="middle" class="button inverse">上傳</text>
  </g>
</svg>
