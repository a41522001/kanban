    <g transform="translate(64 202)"><text class="display">回到正在推進的工作</text><text y="34" class="body" fill="#697287">登入後，接續上次停下的地方。</text><text y="100" class="body" font-weight="700">電子郵件</text><rect y="116" width="342" height="48" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="146" class="body" fill="#8B95A8">you@example.com</text><text y="208" class="body" font-weight="700">密碼</text><rect y="224" width="342" height="48" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="14" y="254" class="body" fill="#8B95A8">••••••••••••</text><text x="342" y="306" text-anchor="end" class="body" fill="#C4573E">忘記密碼？</text><rect y="340" width="342" height="50" rx="9" fill="#DF6E51"/><text x="171" y="371" text-anchor="middle" class="btn">登入 Flowboard</text><line x1="0" y1="438" x2="342" y2="438" stroke="#D9DEE7"/><rect x="151" y="426" width="40" height="24" fill="#F7F8FA"/><text x="171" y="443" text-anchor="middle" class="small">或</text><rect y="478" width="342" height="48" rx="9" fill="#FFF" stroke="#CDD3DE"/><circle cx="113" cy="502" r="10" fill="#29324A"/><text x="133" y="507" class="body" font-weight="700">使用 Google 繼續</text><text x="171" y="598" text-anchor="middle" class="body">第一次使用？ <tspan fill="#C4573E" font-weight="700">建立帳號</tspan></text></g>
    <text x="68" y="890" class="tiny">FLOWBOARD / REAL-TIME COLLABORATION</text>
