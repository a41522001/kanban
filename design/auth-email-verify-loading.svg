<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Flowboard 正在驗證電子郵件</title>
  <desc id="description">從驗證信開啟連結後，前端正在等待驗證 API 回應時顯示的處理中畫面。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans TC", "PingFang TC", Arial, sans-serif; }
      .ink { fill: #29324A; }
      .muted { fill: #697287; }
      .soft { fill: #BFC7D7; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F7F8FA"/>
  <rect width="506" height="900" fill="#29324A"/>

  <!-- 沿用驗證結果頁的品牌區；未取得 API 結果前不顯示成功狀態。 -->
  <g transform="translate(72 64)">
    <rect width="18" height="25" rx="4" fill="#DF6E51"/>
    <rect x="24" y="8" width="18" height="17" rx="4" fill="#A9D2C8"/>
    <text x="56" y="22" fill="#F7F8FA" font-size="24" font-weight="700">Flowboard</text>
  </g>
  <text x="72" y="260" fill="#F7F8FA" font-size="37" font-weight="700" letter-spacing="-1">每段協作，</text>
  <text x="72" y="316" fill="#F7F8FA" font-size="37" font-weight="700" letter-spacing="-1">都有個起點。</text>
  <text x="72" y="368" class="soft" font-size="15">正在確認信箱，稍後就能繼續下一步。</text>

  <rect x="72" y="492" width="364" height="206" rx="12" fill="#36415D"/>
  <text x="96" y="530" class="soft" font-size="12" letter-spacing="1">FLOWBOARD / 開始協作前</text>
  <rect x="96" y="548" width="316" height="124" rx="9" fill="#FFFFFF"/>
  <circle cx="120" cy="577" r="5" fill="#DF6E51"/>
  <text x="134" y="581" class="muted" font-size="12">處理中</text>
  <text x="116" y="620" class="ink" font-size="20" font-weight="700">確認你的電子郵件</text>
  <text x="116" y="648" class="muted" font-size="14">正在核對驗證連結</text>
  <text x="72" y="846" class="soft" font-size="13">把下一步交代清楚，工作就能往前走。</text>

  <!-- 等待 PATCH /auth/verify/:token 回應；這裡不預告驗證結果。 -->
  <g transform="translate(714 140)">
    <text class="muted" font-size="13" font-weight="600" letter-spacing="1">電子郵件驗證 / 處理中</text>
    <text y="98" class="ink" font-size="42" font-weight="700" letter-spacing="-1">正在驗證你的電子郵件</text>
    <text y="151" class="muted" font-size="16">我們正在確認信件中的驗證連結。</text>
    <text y="180" class="muted" font-size="16">請稍候，完成後會在這裡顯示結果。</text>

    <path d="M0 245H580" stroke="#D9DEE7"/>
    <text y="303" class="ink" font-size="17" font-weight="700">驗證進行中</text>
    <text y="336" class="muted" font-size="15">不需要重新開啟連結或重複送出請求。</text>

    <circle cx="13" cy="413" r="11" fill="none" stroke="#D9DEE7" stroke-width="3"/>
    <path d="M13 402a11 11 0 0 1 10 7" fill="none" stroke="#DF6E51" stroke-width="3" stroke-linecap="round"/>
    <text x="39" y="419" class="ink" font-size="15" font-weight="600">驗證中…</text>
  </g>
</svg>
