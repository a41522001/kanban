<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="1520 80 1440 900">
<defs>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#29324A" flood-opacity=".10"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.label{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:38px;font-weight:750;letter-spacing:-.03em}.title{font-size:25px;font-weight:700}.body{font-size:15px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;letter-spacing:.05em;fill:#697287}.inverse{fill:#F7F8FA}.soft{fill:#BFC7D7}.btn{font-size:14px;font-weight:700;fill:#FFF9F4}.card-title{font-size:14px;font-weight:650}.col{font-size:14px;font-weight:700}.chip{font-size:11px;font-weight:700}
    </style>
    <g id="logo"><rect width="18" height="25" rx="4" fill="#DF6E51"/><rect x="24" y="8" width="18" height="17" rx="4" fill="#A9D2C8"/><text x="56" y="21" class="title inverse">Flowboard</text></g>
    <g id="flow"><path d="M8 10h36m12 0h36m12 0h36" stroke="#AAB3C2" stroke-width="2" stroke-linecap="round"/><circle cx="0" cy="10" r="7" fill="#DF6E51"/><circle cx="48" cy="10" r="7" fill="#A9D2C8"/><circle cx="96" cy="10" r="7" fill="#E6B960"/><circle cx="144" cy="10" r="7" fill="#907ECE"/></g>
    <g id="card-a" filter="url(#s)"><rect width="246" height="126" rx="9" fill="#FFF"/><rect x="14" y="14" width="48" height="20" rx="10" fill="#FCE5DF"/><text x="38" y="28" text-anchor="middle" class="chip" fill="#A9432E">API</text><text x="14" y="58" class="card-title">建立使用者註冊 API</text><text x="14" y="82" class="small">Auth · Backend</text><circle cx="220" cy="98" r="13" fill="#907ECE"/><text x="220" y="102" text-anchor="middle" class="small inverse">J</text></g>
    <g id="card-b" filter="url(#s)"><rect width="246" height="118" rx="9" fill="#FFF"/><rect x="14" y="14" width="64" height="20" rx="10" fill="#E3F1EC"/><text x="46" y="28" text-anchor="middle" class="chip" fill="#3E756B">Session</text><text x="14" y="58" class="card-title">Session Cookie 驗證流程</text><text x="14" y="82" class="small">Redis · Auth</text><rect x="14" y="98" width="116" height="6" rx="3" fill="#DFE4E9"/><rect x="14" y="98" width="72" height="6" rx="3" fill="#6EA99E"/></g>
  </defs>
<g id="desktop-signup">
    <rect x="1520" y="80" width="1440" height="900" rx="18" fill="#F7F8FA"/><path d="M1520 98q0-18 18-18h418v900h-418q-18 0-18-18z" fill="#29324A"/><use href="#logo" transform="translate(1576 136)"/>
    <g transform="translate(1576 322)"><text class="display inverse">從第一張卡片，</text><text y="48" class="display inverse">開始建立節奏。</text><text y="92" class="body soft">建立工作區，再邀請團隊一起把工作往前推。</text><g transform="translate(0 142)"><rect width="300" height="162" rx="12" fill="#36405A"/><rect x="22" y="24" width="116" height="8" rx="4" fill="#A9D2C8"/><rect x="22" y="52" width="256" height="42" rx="8" fill="#F7F8FA"/><rect x="40" y="68" width="112" height="6" rx="3" fill="#29324A"/><circle cx="245" cy="73" r="12" fill="#DF6E51"/><rect x="22" y="108" width="192" height="32" rx="8" fill="#4A556F"/></g></g>
    <text x="1576" y="928" class="tiny soft">ONE WORKSPACE / ONE SHARED FLOW</text>
    <g transform="translate(2165 146)">
      <text class="tiny">建立帳號</text><text y="48" class="display">開始你的工作區</text><text y="82" class="body" fill="#697287">只需要一分鐘，之後可以再邀請成員。</text>
      <text y="136" class="body" font-weight="700">顯示名稱</text><rect y="152" width="480" height="46" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="16" y="181" class="body" fill="#8B95A8">例如：Jeffery</text>
      <text y="246" class="body" font-weight="700">電子郵件</text><rect y="262" width="480" height="46" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="16" y="291" class="body" fill="#8B95A8">you@example.com</text>
      <text y="356" class="body" font-weight="700">密碼</text><rect y="372" width="480" height="46" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="16" y="401" class="body" fill="#8B95A8">至少 8 個字元</text><rect y="434" width="112" height="4" rx="2" fill="#6EA99E"/><rect x="122" y="434" width="112" height="4" rx="2" fill="#6EA99E"/><rect x="244" y="434" width="112" height="4" rx="2" fill="#D9DEE7"/><rect x="366" y="434" width="112" height="4" rx="2" fill="#D9DEE7"/>
      <text y="506" class="body" font-weight="700">確認密碼</text><rect y="522" width="480" height="46" rx="9" fill="#FFF" stroke="#CDD3DE"/><text x="16" y="551" class="body" fill="#8B95A8">再次輸入密碼</text><rect y="600" width="18" height="18" rx="4" fill="#29324A"/><path d="M4 609l4 4 7-8" stroke="#FFF" stroke-width="2" fill="none"/>
      <text x="30" y="614" class="small">我同意服務條款與隱私權政策</text><rect y="652" width="480" height="52" rx="9" fill="#DF6E51"/><text x="240" y="684" text-anchor="middle" class="btn">建立工作區</text><text x="240" y="758" text-anchor="middle" class="body">已經有帳號？ <tspan fill="#C4573E" font-weight="700">返回登入</tspan></text>
    </g>
  </g>
</svg>