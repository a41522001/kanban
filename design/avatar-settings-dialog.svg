<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="surface-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#111827" flood-opacity=".2"/>
    </filter>
    <linearGradient id="photo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B8AB"/>
      <stop offset="1" stop-color="#FFF1D8"/>
    </linearGradient>
    <clipPath id="crop-area"><rect width="456" height="320" rx="12"/></clipPath>
    <clipPath id="preview-64"><circle cx="32" cy="32" r="32"/></clipPath>
    <clipPath id="preview-32"><circle cx="16" cy="16" r="16"/></clipPath>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec-label{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:32px;font-weight:750;letter-spacing:-.03em}.title{font-size:24px;font-weight:700}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;letter-spacing:.04em;fill:#697287}.inverse{fill:#F7F8FA}.button{font-size:14px;font-weight:700}.medium{font-weight:700}
    </style>
    <g id="logo">
      <rect width="18" height="24" rx="4" fill="#DF6E51"/>
      <rect x="24" y="8" width="18" height="16" rx="4" fill="#A9D2C8"/>
      <text x="56" y="20" class="h2 inverse">Flowboard</text>
    </g>
    <g id="plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></g>
    <g id="minus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8h12"/></g>
    <g id="close" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l12 12M15 3 3 15"/></g>
    <g id="refresh" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8a6 6 0 1 1-1.8-4.3M14 2v4h-4"/></g>
    <!-- Sample photo: stands in for the user's uploaded image -->
    <g id="photo">
      <rect width="600" height="420" fill="url(#photo-sky)"/>
      <circle cx="460" cy="96" r="44" fill="#FFF9F4" opacity=".8"/>
      <path d="M0 300 140 210 250 270 380 190 600 300v120H0z" fill="#6EA99E"/>
      <path d="M0 350 180 290 330 340 470 300 600 350v70H0z" fill="#31665D"/>
      <circle cx="300" cy="182" r="58" fill="#E6B960"/>
      <path d="M200 420c0-120 44-186 100-186s100 66 100 186z" fill="#DF6E51"/>
    </g>
  </defs>

  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="48" class="spec-label">ACCOUNT / AVATAR SETTINGS · CROP / 1440 × 900</text>

  <g id="avatar-settings-desktop">
    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#E9ECF1"/>
    <path d="M40 100q0-20 20-20h1400q20 0 20 20v44H40z" fill="#29324A"/>
    <g transform="translate(72 100)">
      <use href="#logo"/>
      <text x="180" y="20" class="body inverse medium">工作區</text>
      <text x="256" y="20" class="body" fill="#BFC7D7">最近</text>
      <rect x="1248" y="-8" width="40" height="40" rx="10" fill="#44506A"/>
      <g transform="translate(1260 4)" color="#F7F8FA"><use href="#plus"/></g>
      <circle cx="1328" cy="12" r="16" fill="#A9D2C8"/><text x="1328" y="17" text-anchor="middle" class="body medium">J</text>
    </g>

    <g transform="translate(328 176)">
      <text class="tiny">工作區</text><text y="44" class="display">無限有限公司</text>
      <text y="76" class="body" fill="#697287">集中查看所有專案，選一個進入主要看板。</text>
      <rect x="920" width="200" height="48" rx="10" fill="#C4573E"/><text x="1020" y="30" text-anchor="middle" class="button inverse">新增專案</text>
      <rect y="156" width="552" height="132" rx="12" fill="#F7F8FA"/>
      <rect x="568" y="156" width="552" height="132" rx="12" fill="#F7F8FA"/>
      <rect y="376" width="352" height="212" rx="12" fill="#F7F8FA"/><rect x="368" y="376" width="352" height="212" rx="12" fill="#F7F8FA"/><rect x="736" y="376" width="352" height="212" rx="12" fill="#F7F8FA"/>
    </g>

    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#172033" opacity=".58"/>

    <g id="dialog" transform="translate(500 194)" filter="url(#surface-shadow)">
      <rect width="520" height="672" rx="18" fill="#FFFFFF"/>
      <text x="32" y="50" class="title">更換頭像</text>
      <rect x="448" y="24" width="40" height="40" rx="9" fill="#F7F8FA"/>
      <g transform="translate(459 35)" color="#697287"><use href="#close"/></g>
      <text x="32" y="82" class="body" fill="#697287">拖曳圖片調整位置，用滑桿或滾輪縮放，圓形範圍內就是頭像。</text>

      <g id="cropper" transform="translate(32 100)">
        <g clip-path="url(#crop-area)">
          <rect width="456" height="320" fill="#182033"/>
          <use href="#photo" transform="translate(-72 -50)"/>
          <!-- Dim everything outside the circular stencil -->
          <path fill="#182033" fill-opacity=".62" fill-rule="evenodd" d="M0 0h456v320H0z M228 30a130 130 0 1 0 0.01 0z"/>
        </g>
        <circle cx="228" cy="160" r="130" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="228" cy="30" r="6" fill="#FFFFFF"/>
        <circle cx="358" cy="160" r="6" fill="#FFFFFF"/>
        <circle cx="228" cy="290" r="6" fill="#FFFFFF"/>
        <circle cx="98" cy="160" r="6" fill="#FFFFFF"/>
      </g>

      <g id="zoom" transform="translate(32 444)">
        <rect width="40" height="40" rx="9" fill="#F7F8FA"/>
        <g transform="translate(12 12)" color="#29324A"><use href="#minus"/></g>
        <rect x="56" y="18" width="344" height="4" rx="2" fill="#D7DCE5"/>
        <rect x="56" y="18" width="138" height="4" rx="2" fill="#DF6E51"/>
        <circle cx="194" cy="20" r="10" fill="#FFFFFF" stroke="#DF6E51" stroke-width="2"/>
        <rect x="416" width="40" height="40" rx="9" fill="#F7F8FA"/>
        <g transform="translate(428 12)" color="#29324A"><use href="#plus"/></g>
      </g>

      <g id="preview" transform="translate(32 508)">
        <text y="27" class="small">實際顯示</text>
        <g transform="translate(76 -10)">
          <g clip-path="url(#preview-64)"><use href="#photo" transform="translate(-41.8 -19.7) scale(.246)"/></g>
          <circle cx="32" cy="32" r="32" fill="none" stroke="#D7DCE5"/>
        </g>
        <g transform="translate(156 6)">
          <g clip-path="url(#preview-32)"><use href="#photo" transform="translate(-20.9 -9.85) scale(.123)"/></g>
          <circle cx="16" cy="16" r="16" fill="none" stroke="#D7DCE5"/>
        </g>
        <text x="204" y="27" class="small">JPG、PNG、WebP，5 MB 以內</text>
      </g>

      <line x1="32" y1="596" x2="488" y2="596" stroke="#D7DCE5"/>
      <g transform="translate(32 612)">
        <rect width="124" height="44" rx="9" fill="#FFFFFF"/>
        <g transform="translate(12 14)" color="#697287"><use href="#refresh"/></g>
        <text x="40" y="28" class="button" fill="#697287">重新選擇</text>
      </g>
      <rect x="270" y="612" width="96" height="44" rx="9" fill="#FFFFFF" stroke="#D7DCE5"/>
      <text x="318" y="640" text-anchor="middle" class="button">取消</text>
      <rect x="378" y="612" width="110" height="44" rx="9" fill="#DF6E51"/>
      <text x="433" y="640" text-anchor="middle" class="button inverse">上傳</text>
    </g>
  </g>
</svg>
