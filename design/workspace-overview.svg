<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="surface-shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#29324A" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec-label{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:32px;font-weight:750;letter-spacing:-.03em}.title{font-size:22px;font-weight:700}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;letter-spacing:.04em;fill:#697287}.inverse{fill:#F7F8FA}.soft{fill:#BFC7D7}.button{font-size:14px;font-weight:700}.medium{font-weight:700}.status{font-size:11px;font-weight:700;letter-spacing:.05em}.member-name{font-size:13px;font-weight:700}.tab{font-size:13px;font-weight:700}
    </style>
    <g id="logo">
      <rect width="18" height="24" rx="4" fill="#DF6E51"/>
      <rect x="24" y="8" width="18" height="16" rx="4" fill="#A9D2C8"/>
      <text x="56" y="20" class="title inverse">Flowboard</text>
    </g>
    <g id="plus-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M8 2v12M2 8h12"/>
    </g>
    <g id="bell-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12c1.4-1.4 2-3.2 2-5a5 5 0 0 1 10 0c0 1.8.6 3.6 2 5H3Z"/><path d="M8 15c.5 1.2 1.5 2 2 2s1.5-.8 2-2"/>
    </g>
    <g id="users-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="5" r="3"/><path d="M1 15c0-3 2-5 5-5s5 2 5 5M11 4c2 0 3 1 3 3 0 1-.5 2-1.5 2.5M12 11c2.5 0 4 1.5 4 4"/>
    </g>
    <g id="archive-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 5h14v11H2zM1 2h16v4H1zM7 9h4"/>
    </g>
    <g id="folder-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 5h6l2 2h8v9H2z"/>
    </g>
    <g id="search-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/>
    </g>
    <g id="arrow-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8h12M10 4l4 4-4 4"/>
    </g>
    <g id="more-icon" fill="currentColor">
      <circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/>
    </g>
  </defs>

  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="48" class="spec-label">WORKSPACE / PROJECT OVERVIEW + MEMBERS / 1440 × 900</text>

  <g id="workspace-project-overview-desktop">
    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#E9ECF1"/>
    <path d="M40 100q0-20 20-20h1400q20 0 20 20v44H40z" fill="#29324A"/>

    <g id="top-navigation" transform="translate(72 100)">
      <use href="#logo"/>
      <text x="180" y="20" class="body inverse medium">工作區</text>
      <rect x="180" y="40" width="44" height="4" rx="2" fill="#DF6E51"/>
      <text x="256" y="20" class="body soft">最近</text>
      <rect x="1192" y="-8" width="40" height="40" rx="10" fill="#29324A"/>
      <g transform="translate(1203 3)" color="#F7F8FA"><use href="#bell-icon"/></g>
      <circle cx="1227" cy="-4" r="8" fill="#DF6E51"/>
      <text x="1227" y="0" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">2</text>
      <rect x="1248" y="-8" width="40" height="40" rx="10" fill="#44506A"/>
      <g transform="translate(1260 4)" color="#F7F8FA"><use href="#plus-icon"/></g>
      <circle cx="1328" cy="12" r="16" fill="#A9D2C8"/>
      <text x="1328" y="17" text-anchor="middle" class="body medium">J</text>
    </g>

    <g id="workspace-sidebar" transform="translate(72 176)">
      <text class="tiny">你的工作區</text>
      <g transform="translate(0 28)">
