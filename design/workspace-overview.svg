          <circle cx="18" cy="20" r="4" fill="#6EA99E"/>
          <text x="57" y="25" text-anchor="middle" class="tab">進行中 1</text>
        </g>
        <g transform="translate(520 12)">
          <rect width="92" height="40" rx="20" fill="#FFFFFF"/>
          <circle cx="18" cy="20" r="4" fill="#E6B960"/>
          <text x="57" y="25" text-anchor="middle" class="tab">暫停 1</text>
        </g>
        <g transform="translate(620 12)">
          <rect width="92" height="40" rx="20" fill="#FFFFFF"/>
          <circle cx="18" cy="20" r="4" fill="#907ECE"/>
          <text x="57" y="25" text-anchor="middle" class="tab">完成 1</text>
        </g>
