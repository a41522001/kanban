        <text x="1096" y="43" text-anchor="end" class="tiny">3 個可見專案</text>
      </g>

      <g id="project-list" transform="translate(0 196)">
        <text class="h2">所有專案</text>
        <text x="704" y="0" text-anchor="end" class="small">選取專案即可查看成員</text>

        <g id="project-flowboard-selected" transform="translate(0 20)" filter="url(#surface-shadow)">
          <rect width="704" height="168" rx="14" fill="#FFFFFF" stroke="#DF6E51" stroke-width="2"/>
          <path d="M0 14Q0 0 14 0h0v168h0Q0 168 0 154z" fill="#DF6E51"/>
          <g transform="translate(24 20)">
