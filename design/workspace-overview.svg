        <g transform="translate(24 232)">
          <circle cx="24" cy="24" r="24" fill="#907ECE"/>
          <text x="24" y="29" text-anchor="middle" class="body inverse medium">M</text>
          <text x="64" y="20" class="member-name">Mina</text>
          <text x="64" y="40" class="small">加入於 9 月 13 日</text>
        </g>
        <g transform="translate(24 300)">
          <circle cx="24" cy="24" r="24" fill="#E6B960"/>
          <text x="24" y="29" text-anchor="middle" class="body medium">A</text>
          <text x="64" y="20" class="member-name">Alex</text>
          <text x="64" y="40" class="small">加入於 9 月 14 日</text>
        </g>
        <g transform="translate(24 368)">
          <circle cx="24" cy="24" r="24" fill="#DF6E51"/>
          <text x="24" y="29" text-anchor="middle" class="body inverse medium">L</text>
          <text x="64" y="20" class="member-name">Lena</text>
          <text x="64" y="40" class="small">加入於 9 月 14 日</text>
        </g>
        <g transform="translate(24 448)">
          <rect width="164" height="44" rx="9" fill="#F7F8FA" stroke="#D7DCE5"/>
          <g transform="translate(20 13)" color="#697287"><use href="#users-icon"/></g>
          <text x="96" y="27" text-anchor="middle" class="button">管理成員</text>
          <rect x="176" width="168" height="44" rx="9" fill="#DF6E51"/>
          <text x="252" y="27" text-anchor="middle" class="button inverse">進入看板</text>
          <g transform="translate(312 14)" color="#FFF9F4"><use href="#arrow-icon"/></g>
        </g>
