        <g transform="translate(0 20)">
          <circle cx="16" cy="16" r="16" fill="#A9D2C8"/><text x="16" y="21" text-anchor="middle" class="body medium">J</text>
          <circle cx="48" cy="16" r="16" fill="#907ECE" stroke="#E9ECF1" stroke-width="2"/><text x="48" y="21" text-anchor="middle" class="body inverse medium">M</text>
          <circle cx="80" cy="16" r="16" fill="#E6B960" stroke="#E9ECF1" stroke-width="2"/><text x="80" y="21" text-anchor="middle" class="body medium">A</text>
          <circle cx="112" cy="16" r="16" fill="#DF6E51" stroke="#E9ECF1" stroke-width="2"/><text x="112" y="21" text-anchor="middle" class="body inverse medium">L</text>
          <circle cx="144" cy="16" r="16" fill="#D9DEE7" stroke="#E9ECF1" stroke-width="2"/><text x="144" y="21" text-anchor="middle" class="small medium">+1</text>
        </g>
        <text y="76" class="small">5 位成員，可分配到不同專案</text>
      </g>
    </g>

    <g id="project-content" transform="translate(328 168)">
      <text class="tiny">JEFFERY 的工作區 / 專案</text>
      <text y="46" class="display">專案中心</text>
      <text y="78" class="body" fill="#697287">選擇專案進入主要看板，或查看各專案的協作成員。</text>

      <g transform="translate(742 4)">
        <rect width="156" height="44" rx="9" fill="#FFFFFF" stroke="#D7DCE5"/>
        <g transform="translate(20 13)" color="#697287"><use href="#users-icon"/></g>
        <text x="92" y="27" text-anchor="middle" class="button">邀請成員</text>
      </g>
      <g transform="translate(912 4)">
        <rect width="208" height="44" rx="9" fill="#DF6E51"/>
        <g transform="translate(24 14)" color="#FFF9F4"><use href="#plus-icon"/></g>
        <text x="116" y="28" text-anchor="middle" class="button inverse">新增專案</text>
      </g>

      <g id="project-toolbar" transform="translate(0 112)">
        <rect width="1120" height="64" rx="12" fill="#F7F8FA" stroke="#D7DCE5"/>
        <g transform="translate(16 12)">
