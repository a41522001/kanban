        <rect x="12" y="12" width="32" height="32" rx="8" fill="#DF6E51"/>
        <text x="28" y="33" text-anchor="middle" class="body inverse medium">J</text>
        <text x="56" y="24" class="body inverse medium">Jeffery 的工作區</text>
        <text x="56" y="42" class="tiny soft">擁有者 · 3 個專案</text>
      </g>
      <g transform="translate(0 96)" color="#697287">
        <rect width="224" height="44" rx="10" fill="#F7F8FA" stroke="#D7DCE5"/>
        <g transform="translate(16 14)"><use href="#plus-icon"/></g>
        <text x="48" y="27" class="body">新增工作區</text>
      </g>
      <line x1="0" y1="168" x2="224" y2="168" stroke="#CDD3DE"/>
      <text y="204" class="tiny">工作區管理</text>
      <g transform="translate(0 224)" color="#29324A">
        <rect x="-8" y="-10" width="224" height="40" rx="10" fill="#F7F8FA"/>
        <g transform="translate(4 2)"><use href="#folder-icon"/></g>
        <text x="32" y="16" class="body medium">專案</text>
        <text x="208" y="16" text-anchor="end" class="small">3</text>
      </g>
      <g transform="translate(0 272)" color="#697287">
        <g transform="translate(4 2)"><use href="#users-icon"/></g>
        <text x="32" y="16" class="body">工作區成員</text>
        <text x="208" y="16" text-anchor="end" class="small">5</text>
      </g>
      <g transform="translate(0 312)" color="#697287">
        <g transform="translate(4 1)"><use href="#archive-icon"/></g>
        <text x="32" y="16" class="body">已封存專案</text>
        <text x="208" y="16" text-anchor="end" class="small">1</text>
      </g>

      <g transform="translate(0 592)">
