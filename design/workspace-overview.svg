          </g>
          <text x="24" y="78" class="title">Flowboard 即時協作</text>
          <text x="24" y="104" class="body" fill="#697287">Socket.IO 即時通知與多人 Kanban 協作練習。</text>
          <g transform="translate(24 128)">
            <text y="14" class="small">主要看板</text>
            <text x="76" y="14" class="body medium">產品交付看板</text>
            <circle cx="224" cy="9" r="2" fill="#CDD3DE"/>
            <text x="238" y="14" class="small">更新於 5 分鐘前</text>
          </g>
          <g transform="translate(552 48)">
            <rect width="120" height="72" rx="10" fill="#F7F8FA"/>
            <rect x="12" y="14" width="18" height="44" rx="5" fill="#FCE5DF"/><rect x="38" y="14" width="18" height="44" rx="5" fill="#E3F1EC"/><rect x="64" y="14" width="18" height="44" rx="5" fill="#FFF1D8"/><rect x="90" y="14" width="18" height="44" rx="5" fill="#E9E6F7"/>
            <rect x="16" y="22" width="10" height="12" rx="2" fill="#FFFFFF"/><rect x="42" y="22" width="10" height="22" rx="2" fill="#FFFFFF"/><rect x="68" y="22" width="10" height="16" rx="2" fill="#FFFFFF"/><rect x="94" y="22" width="10" height="28" rx="2" fill="#FFFFFF"/>
          </g>
          <g transform="translate(664 16)" color="#697287"><use href="#more-icon"/></g>
        </g>

        <g id="project-release" transform="translate(0 204)">
          <rect width="704" height="148" rx="14" fill="#F7F8FA" stroke="#D7DCE5"/>
          <rect width="6" height="148" rx="3" fill="#E6B960"/>
          <g transform="translate(24 18)">
            <rect width="68" height="26" rx="13" fill="#FFF1D8"/>
            <circle cx="14" cy="13" r="4" fill="#E6B960"/>
            <text x="43" y="17" text-anchor="middle" class="status" fill="#7A4D00">暫停中</text>
          </g>
          <text x="24" y="72" class="h2">發佈自動化</text>
          <text x="24" y="98" class="body" fill="#697287">CI/CD、部署檢查與環境穩定性追蹤。</text>
          <text x="24" y="128" class="small">主要看板 · 發佈流程</text>
          <g transform="translate(552 42)">
            <rect width="120" height="64" rx="10" fill="#FFFFFF"/>
            <path d="M18 26h20m12 0h20m12 0h20" stroke="#CDD3DE" stroke-width="2" stroke-linecap="round"/>
            <circle cx="14" cy="26" r="6" fill="#DF6E51"/><circle cx="46" cy="26" r="6" fill="#A9D2C8"/><circle cx="78" cy="26" r="6" fill="#E6B960"/><circle cx="110" cy="26" r="6" fill="#907ECE"/>
            <text x="60" y="50" text-anchor="middle" class="tiny">更新於昨天</text>
          </g>
          <g transform="translate(664 16)" color="#697287"><use href="#more-icon"/></g>
        </g>

        <g id="project-learning" transform="translate(0 368)">
          <rect width="704" height="148" rx="14" fill="#F7F8FA" stroke="#D7DCE5"/>
          <rect width="6" height="148" rx="3" fill="#907ECE"/>
          <g transform="translate(24 18)">
            <rect width="68" height="26" rx="13" fill="#E9E6F7"/>
            <circle cx="14" cy="13" r="4" fill="#907ECE"/>
            <text x="43" y="17" text-anchor="middle" class="status" fill="#55438F">已完成</text>
          </g>
          <text x="24" y="72" class="h2">技術成長計畫</text>
          <text x="24" y="98" class="body" fill="#697287">.NET、AWS 與系統設計學習路線。</text>
          <text x="24" y="128" class="small">主要看板 · 2026 學習地圖</text>
          <g transform="translate(552 42)">
            <rect width="120" height="64" rx="10" fill="#FFFFFF"/>
            <circle cx="60" cy="26" r="18" fill="none" stroke="#D9DEE7" stroke-width="6"/>
            <path d="M60 8a18 18 0 1 1-17 24" fill="none" stroke="#907ECE" stroke-width="6" stroke-linecap="round"/>
            <text x="60" y="30" text-anchor="middle" class="tiny" font-weight="700">100%</text>
            <text x="60" y="54" text-anchor="middle" class="tiny">8 月 18 日完成</text>
          </g>
          <g transform="translate(664 16)" color="#697287"><use href="#more-icon"/></g>
        </g>
