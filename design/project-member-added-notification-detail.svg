<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="dialog-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#182033" flood-opacity=".25"/>
    </filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:32px;font-weight:750}.title{font-size:20px;font-weight:700}.h2{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#697287}.inverse{fill:#F7F8FA}.medium{font-weight:700}.mint{fill:#31665D}.lavender{fill:#55438F}
    </style>
    <g id="logo"><rect width="18" height="24" rx="4" fill="#DF6E51"/><rect x="24" y="8" width="18" height="16" rx="4" fill="#A9D2C8"/><text x="56" y="20" class="h2 inverse">Flowboard</text></g>
    <g id="plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></g>
    <g id="bell" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3.2 3.2L13 4.5"/></g>
    <g id="x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></g>
    <g id="arrow" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h12M9 3l5 5-5 5"/></g>
    <g id="members" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="3"/><path d="M1.5 15c.7-3 2.5-4.5 5.5-4.5S11.8 12 12.5 15M13 3.5a3 3 0 0 1 0 5.7M14 11c2 .4 3.2 1.7 3.6 4"/></g>
  </defs>

  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="48" class="spec">PROJECT MEMBER ADDED / NOTIFICATION DETAIL / DESKTOP / 1440 × 900</text>

  <g id="project-member-added-desktop">
    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#E9ECF1"/>
    <path d="M40 100q0-20 20-20h1400q20 0 20 20v44H40z" fill="#29324A"/>
    <g transform="translate(72 100)">
      <use href="#logo"/><text x="180" y="20" class="body inverse medium">工作區</text><text x="256" y="20" class="body" fill="#BFC7D7">最近</text>
      <rect x="1188" y="-8" width="40" height="40" rx="9" fill="#DF6E51"/><g transform="translate(1200 4)" color="#F7F8FA"><use href="#plus"/></g>
      <rect x="1240" y="-8" width="40" height="40" rx="9" fill="#F7F8FA"/><g transform="translate(1250 2)" color="#29324A"><use href="#bell"/></g>
      <circle cx="1328" cy="12" r="16" fill="#A9D2C8"/><text x="1328" y="17" text-anchor="middle" class="body medium">J</text>
    </g>

    <g transform="translate(72 176)">
      <text class="small">工作區 / 專案中心</text><text y="44" class="display">無限有限公司</text><text y="76" class="body" fill="#697287">集中管理專案、成員與即時協作。</text>
      <g transform="translate(0 116)"><rect width="640" height="132" rx="14" fill="#FFFFFF"/><rect width="6" height="132" rx="3" fill="#DF6E51"/><text x="28" y="42" class="h2">Flowboard 即時協作</text><text x="28" y="70" class="small">進行中 · 5 位專案成員</text><rect x="474" y="42" width="138" height="44" rx="9" fill="#DF6E51"/><text x="543" y="70" text-anchor="middle" class="body inverse medium">進入專案</text></g>
      <g transform="translate(668 116)"><rect width="452" height="328" rx="16" fill="#FFFFFF"/><text x="24" y="40" class="label">專案成員</text><circle cx="48" cy="86" r="20" fill="#A9D2C8"/><text x="48" y="91" text-anchor="middle" class="body medium">J</text><text x="84" y="82" class="body medium">Jeffery</text><text x="84" y="102" class="small">EDITOR</text><line x1="24" y1="126" x2="428" y2="126" stroke="#E9ECF1"/><circle cx="48" cy="166" r="20" fill="#907ECE"/><text x="48" y="171" text-anchor="middle" class="body inverse medium">M</text><text x="84" y="162" class="body medium">Mina</text><text x="84" y="182" class="small">OWNER</text></g>
    </g>

    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#182033" opacity=".5"/>

    <g id="project-member-added-dialog" transform="translate(500 228)" filter="url(#dialog-shadow)">
      <rect width="520" height="544" rx="18" fill="#FFFFFF"/>
      <rect width="520" height="6" rx="3" fill="#A9D2C8"/>

      <circle cx="46" cy="50" r="22" fill="#E3F1EC"/>
      <g transform="translate(36 40)" color="#31665D"><use href="#members"/></g>
      <circle cx="61" cy="64" r="9" fill="#31665D" stroke="#FFFFFF" stroke-width="3"/>
      <g transform="translate(54 57) scale(.9)" color="#FFFFFF"><use href="#check"/></g>
      <text x="84" y="45" class="title">你已加入專案</text>
      <text x="84" y="67" class="small">專案已出現在你的工作區，可以開始協作</text>
      <rect x="460" y="26" width="36" height="36" rx="9" fill="#F7F8FA"/>
      <g transform="translate(470 36)" color="#697287"><use href="#x"/></g>

      <g transform="translate(24 98)">
        <rect width="472" height="142" rx="14" fill="#F7FAF9" stroke="#C8E3DB"/>
        <rect x="18" y="20" width="56" height="56" rx="14" fill="#DF6E51"/>
        <text x="46" y="55" text-anchor="middle" class="h2 inverse">F</text>
        <circle cx="72" cy="70" r="15" fill="#907ECE" stroke="#F7FAF9" stroke-width="4"/>
        <text x="72" y="75" text-anchor="middle" class="small inverse medium">M</text>
        <text x="94" y="35" class="small">Mina 已將你加入</text>
        <text x="94" y="64" class="h2">Flowboard 即時協作</text>
        <text x="94" y="88" class="small">無限有限公司</text>
        <rect x="18" y="104" width="84" height="24" rx="12" fill="#E3F1EC"/>
        <circle cx="33" cy="116" r="7" fill="#31665D"/>
        <g transform="translate(27 110) scale(.75)" color="#FFFFFF"><use href="#check"/></g>
        <text x="45" y="120" class="tiny mint medium">已加入</text>
        <rect x="364" y="104" width="90" height="24" rx="12" fill="#E9E6F7"/>
        <text x="409" y="120" text-anchor="middle" class="tiny lavender medium">EDITOR</text>
      </g>

      <g transform="translate(24 268)">
        <text class="label">成員資訊</text>
        <text y="34" class="small">工作區</text><text x="472" y="34" text-anchor="end" class="body medium">無限有限公司</text>
        <line y1="52" x2="472" y2="52" stroke="#E9ECF1"/>
        <text y="82" class="small">專案角色</text><text x="472" y="82" text-anchor="end" class="body medium">編輯者</text>
        <line y1="100" x2="472" y2="100" stroke="#E9ECF1"/>
        <text y="130" class="small">加入時間</text><text x="472" y="130" text-anchor="end" class="body medium">2026 年 9 月 20 日 13:42</text>
      </g>

      <line x1="24" y1="422" x2="496" y2="422" stroke="#D7DCE5"/>
      <rect x="24" y="442" width="148" height="48" rx="10" fill="#FFFFFF" stroke="#CDD3DE"/>
      <text x="98" y="472" text-anchor="middle" class="body medium">關閉</text>
      <rect x="184" y="442" width="312" height="48" rx="10" fill="#DF6E51"/>
      <text x="329" y="472" text-anchor="middle" class="body inverse medium">前往專案</text>
      <g transform="translate(431 458)" color="#F7F8FA"><use href="#arrow"/></g>
      <text x="260" y="520" text-anchor="middle" class="tiny">你可以隨時從「無限有限公司」再次開啟這個專案</text>
    </g>
  </g>
</svg>
