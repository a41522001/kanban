<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
  <defs>
    <filter id="dialog-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#182033" flood-opacity=".25"/></filter>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif;fill:#29324A}.spec{font-size:20px;font-weight:700;letter-spacing:.08em;fill:#697287}.display{font-size:32px;font-weight:750}.title{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#697287}.tiny{font-size:11px;fill:#8B95A8}.label{font-size:11px;font-weight:700;letter-spacing:.03em}.inverse{fill:#F7F8FA}.muted{fill:#BFC7D7}.medium{font-weight:700}
    </style>
    <g id="logo"><rect width="18" height="24" rx="4" fill="#DF6E51"/><rect x="24" y="8" width="18" height="16" rx="4" fill="#A9D2C8"/><text x="56" y="20" class="h2 inverse">Flowboard</text></g>
    <g id="plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></g>
    <g id="bell" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3.2 3.2L13 4.5"/></g>
    <g id="x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></g>
  </defs>

  <rect width="1520" height="1000" fill="#E9ECF1"/>
  <text x="40" y="48" class="spec">WORKSPACE INVITATION / DETAIL DIALOG / DESKTOP / 1440 × 900</text>
  <g id="workspace-invitation-detail-dialog-desktop">
    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#E9ECF1"/>
    <path d="M40 100q0-20 20-20h1400q20 0 20 20v44H40z" fill="#29324A"/>
    <g transform="translate(72 100)">
      <use href="#logo"/><text x="180" y="20" class="body inverse medium">工作區</text><text x="256" y="20" class="body muted">最近</text>
      <rect x="1188" y="-8" width="40" height="40" rx="9" fill="#DF6E51"/><g transform="translate(1200 4)" color="#F7F8FA"><use href="#plus"/></g>
      <rect x="1240" y="-8" width="40" height="40" rx="9" fill="#F7F8FA"/><g transform="translate(1250 2)" color="#29324A"><use href="#bell"/></g>
      <circle cx="1328" cy="12" r="16" fill="#A9D2C8"/><text x="1328" y="17" text-anchor="middle" class="body medium">J</text>
    </g>
    <g transform="translate(72 176)">
      <text class="small">工作區</text><text y="44" class="display">Jeffery 的工作區</text><text y="76" class="body" fill="#697287">集中查看所有專案，選一個進入主要看板。</text>
      <text y="136" class="title">最近開啟</text>
      <rect y="156" width="552" height="132" rx="12" fill="#F7F8FA"/><rect y="156" width="4" height="132" rx="2" fill="#DF6E51"/>
      <rect x="568" y="156" width="552" height="132" rx="12" fill="#F7F8FA"/><rect x="568" y="156" width="4" height="132" rx="2" fill="#A9D2C8"/>
    </g>

    <rect x="40" y="80" width="1440" height="900" rx="20" fill="#182033" opacity=".48"/>

    <g id="workspace-invitation-dialog" transform="translate(500 252)" filter="url(#dialog-shadow)">
      <rect width="520" height="456" rx="18" fill="#FFFFFF"/>
      <rect width="520" height="6" rx="3" fill="#DF6E51"/>
      <circle cx="44" cy="48" r="22" fill="#FCE5DF"/><g transform="translate(36 40)" color="#9F3F2C"><use href="#bell"/></g>
      <text x="82" y="43" class="title">工作區邀請</text><text x="82" y="65" class="small">查看邀請內容後再決定是否加入</text>
      <rect x="460" y="24" width="36" height="36" rx="9" fill="#F7F8FA"/><g transform="translate(470 34)" color="#697287"><use href="#x"/></g>
      <line x1="24" y1="92" x2="496" y2="92" stroke="#D7DCE5"/>

      <g transform="translate(24 112)">
        <rect width="472" height="112" rx="14" fill="#FFF9F7" stroke="#E8B8AB"/>
        <circle cx="48" cy="48" r="26" fill="#DF6E51"/><text x="48" y="54" text-anchor="middle" class="h2 inverse">M</text>
        <text x="88" y="35" class="small">Mia 邀請你加入</text>
        <text x="88" y="64" class="h2">產品開發中心</text>
        <text x="88" y="88" class="small">加入後可查看專案，並以成員身分參與協作。</text>
      </g>

      <g transform="translate(24 244)">
        <text class="label" fill="#697287">邀請詳情</text>
        <text y="32" class="small">角色</text><text x="448" y="32" text-anchor="end" class="body medium">成員</text>
        <line y1="48" x2="448" y2="48" stroke="#E9ECF1"/>
        <text y="76" class="small">有效期限</text><text x="448" y="76" text-anchor="end" class="body medium">7 天後到期</text>
      </g>

      <line x1="24" y1="348" x2="496" y2="348" stroke="#D7DCE5"/>
      <rect x="24" y="368" width="228" height="48" rx="10" fill="#FFFFFF" stroke="#CDD3DE"/>
      <g transform="translate(84 384)" color="#697287"><use href="#x"/></g><text x="146" y="398" text-anchor="middle" class="body medium">婉拒</text>
      <rect x="268" y="368" width="228" height="48" rx="10" fill="#DF6E51"/>
      <g transform="translate(326 384)" color="#F7F8FA"><use href="#check"/></g><text x="390" y="398" text-anchor="middle" class="body inverse medium">接受邀請</text>
      <text x="24" y="440" class="tiny">開啟詳情可標記通知已讀；回覆狀態由 Workspace Invitation 管理</text>
    </g>
  </g>
</svg>
