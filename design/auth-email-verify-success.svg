<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Flowboard 電子郵件驗證成功</title>
  <desc id="description">從驗證信開啟連結後，電子郵件驗證成功的結果畫面，提供返回登入頁的操作。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans TC", "PingFang TC", Arial, sans-serif; }
      .ink { fill: #29324A; }
      .muted { fill: #697287; }
      .soft { fill: #BFC7D7; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F7F8FA"/>
  <rect width="506" height="900" fill="#29324A"/>

  <!-- 保留驗證提示頁的品牌區，卡片只改變已完成的狀態。 -->
  <g transform="translate(72 64)">
    <rect width="18" height="25" rx="4" fill="#DF6E51"/>
    <rect x="24" y="8" width="18" height="17" rx="4" fill="#A9D2C8"/>
    <text x="56" y="22" fill="#F7F8FA" font-size="24" font-weight="700">Flowboard</text>
  </g>
  <text x="72" y="260" fill="#F7F8FA" font-size="37" font-weight="700" letter-spacing="-1">每段協作，</text>
  <text x="72" y="316" fill="#F7F8FA" font-size="37" font-weight="700" letter-spacing="-1">都有個起點。</text>
  <text x="72" y="368" class="soft" font-size="15">信箱已確認，接下來就能與團隊一起推進工作。</text>

  <rect x="72" y="492" width="364" height="206" rx="12" fill="#36415D"/>
  <text x="96" y="530" class="soft" font-size="12" letter-spacing="1">FLOWBOARD / 開始協作前</text>
  <rect x="96" y="548" width="316" height="124" rx="9" fill="#FFFFFF"/>
  <circle cx="120" cy="577" r="10" fill="#6EA99E"/>
  <path d="M115 577l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="581" class="muted" font-size="12">已完成</text>
  <text x="116" y="620" class="ink" font-size="20" font-weight="700">確認你的電子郵件</text>
  <text x="116" y="648" class="muted" font-size="14">現在可以登入 Flowboard</text>
  <text x="72" y="846" class="soft" font-size="13">把下一步交代清楚，工作就能往前走。</text>

  <!-- API 回傳 data: null，因此結果頁不顯示信箱或帳號資料。 -->
  <g transform="translate(714 140)">
    <text class="muted" font-size="13" font-weight="600" letter-spacing="1">電子郵件驗證 / 已完成</text>
    <text y="98" class="ink" font-size="42" font-weight="700" letter-spacing="-1">電子郵件驗證成功</text>
    <text y="151" class="muted" font-size="16">你的信箱已完成驗證。</text>
    <text y="180" class="muted" font-size="16">請返回登入頁，使用帳號與密碼登入 Flowboard。</text>

    <path d="M0 245H580" stroke="#D9DEE7"/>
    <text y="303" class="ink" font-size="17" font-weight="700">下一步</text>
    <text y="336" class="muted" font-size="15">登入後，就能開始使用 Flowboard。</text>

    <rect y="389" width="280" height="52" rx="8" fill="#DF6E51"/>
    <text x="140" y="422" text-anchor="middle" fill="#FFF9F4" font-size="16" font-weight="700">前往登入</text>
  </g>
</svg>
