name: cd

on: 
  push: 
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  
  build: 
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: 抓取程式碼
        uses: actions/checkout@v7

      - name: 登入github
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包前端
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/a41522001/kanban-frontend:latest
            ghcr.io/a41522001/kanban-frontend:${{ github.sha }}

      - name: 打包後端
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/a41522001/kanban-backend:latest
            ghcr.io/a41522001/kanban-backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 抓取程式碼
        uses: actions/checkout@v7

      - name: SCP 傳送 compose.prod.yml
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.prod.yml"
          target: /app

      - name: SSH 進 VM 部署
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /app
            echo "IMAGE_TAG=${{ github.sha }}" > .env
            cp compose.prod.yml compose.yml
            docker compose pull
            docker compose up -d
            docker image prune -af