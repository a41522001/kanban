name: ci

on:
  push:
    branches: [main, dev, 'feature/*']
    
  workflow_dispatch:

jobs:
  test-backend: 
    runs-on: ubuntu-latest

    steps: 
      - name: test
        run: echo "hello world"

      - name: 抓取程式碼
        uses: actions/checkout@v7

      - name: 安裝Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安裝pnpm
        run: npm i -g pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 執行測試
        run: pnpm run test:backend