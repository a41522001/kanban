name: ci

on:
  push:
    branches: [main, dev, 'feature/*']
    
  workflow_dispatch:

jobs:
  test-backend: 
    runs-on: ubuntu-latest

    steps: 
      - name: 抓取程式碼
        uses: actions/checkout@v7

      - name: 安裝Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安裝pnpm
        run: npm i -g pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 建立prisma
        working-directory: ./backend
        run: npx prisma generate

      - name: 建立 E2E 環境設定
        run: cp backend/.env.e2e.example backend/.env.e2e

      - name: 執行 Backend E2E
        run: pnpm test:backend:e2e

      - name: 執行單元測試
        run: pnpm run test:backend